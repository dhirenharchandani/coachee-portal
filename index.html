// How sure, in words the client can read without learning our labels (from "The Read").
const PM_CONF_LABEL = { solid: 'Established', live: 'Emerging possibility', thin: 'Question' };
const PM_CONF_HINT = { solid: 'seen in more than one setting, with known exceptions', live: 'seen more than once; another explanation still stands', thin: 'your answer could settle it' };
const PM_CONF_DOTS = { thin: 1, live: 2, solid: 3 };

function PmSure({ c, small }) {
  const n = PM_CONF_DOTS[c] || 0, color = PM_CONF_COLOR[c];
  return (
    <span className="inline-flex items-center gap-1.5" title={`${PM_CONF_LABEL[c]}: ${PM_CONF_HINT[c]}`}>
      <span className="inline-flex gap-[3px]">{[1, 2, 3].map(i => <span key={i} className="rounded-full" style={{ width: small ? 6 : 7, height: small ? 6 : 7, background: i <= n ? color : 'transparent', border: `1px solid ${i <= n ? color : 'var(--border)'}` }} />)}</span>
      <span className={(small ? 'text-[11px]' : 'text-xs') + ' font-medium'} style={{ color }}>{PM_CONF_LABEL[c]}</span>
    </span>
  );
}

// What the read was built from: the sessions every pass read, their date range, and how many weeks that spans.
function pmReadInfo(pm) {
  const ids = [...new Set(pm.runs.flatMap(r => r.sessions_read || []))].filter(id => /^\d{4}-\d{2}-\d{2}/.test(id)).sort();
  if (!ids.length) return null;
  const first = ids[0].slice(0, 10), last = ids[ids.length - 1].slice(0, 10);
  const weeks = Math.max(1, Math.round((new Date(last) - new Date(first)) / (7 * 864e5)));
  const lastRun = pm.runs[pm.runs.length - 1]?.created_at;
  return { sessions: ids.length, first, last, weeks, lastRun };
}
const pmDay = (d) => new Date(d + 'T12:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });

// The quote that best carries a finding: the client's own words, said in the room if possible, shortest first.
function pmBestQuote(pm, f) {
  const ev = pm.evidenceFor(f.id).filter(e => !e.is_counter && e.speaker === 'client');
  const rank = { direct: 0, self_report: 1, inference: 2 };
  return ev.sort((a, b) => (rank[a.class] ?? 3) - (rank[b.class] ?? 3) || a.quote.length - b.quote.length)[0] || null;
}

function PmLegend() {
  return (
    <div className="surface rounded-2xl p-5">
      <p className="text-[10px] tracking-[0.2em] uppercase text-faint mb-3">How to read the labels</p>
      <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
        {['solid', 'live', 'thin'].map(c => <div key={c}><PmSure c={c} /><p className="text-faint text-xs mt-1">{PM_CONF_HINT[c][0].toUpperCase() + PM_CONF_HINT[c].slice(1)}.</p></div>)}
        <div><span className="text-xs font-medium text-dim">Nothing yet</span><p className="text-faint text-xs mt-1">Not seen often enough to show. We don't fill an area just to have something there.</p></div>
      </div>
    </div>
  );
}

// Coach-only: whether this client's own login can open their read. Off by default; the database enforces it.
function PmClientAccess({ pm, name }) {
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const s = pm.settings;
  const on = !!s?.visible;
  const toggle = async () => {
    if (!on && !window.confirm(`Let ${name} open the read in their own login?\n\n${name} sees exactly what "Show as client" shows: confirmed findings, shared predictions and active suggestions, and is asked to agree before anything appears. You can turn it off again at any time.`)) return;
    setBusy(true); setErr('');
    const r = await pmAttempt(() => pm.setClientVisible(!on));
    setBusy(false); if (!r.ok) setErr(r.error);
  };
  const hasRead = pm.findings.length + pm.predictions.length + pm.interventions.length + pm.runs.length > 0;
  const askedDelete = !!s?.delete_requested_at;
  const del = async () => {
    const typed = window.prompt(`Delete ${name}'s read?\n\nThis permanently deletes every finding, quote, prediction, suggestion and their history for ${name}, switches the read off and clears ${name}'s agreement. Session transcripts are kept. It cannot be undone.\n\nType ${name} to confirm.`);
    if (typed === null) return;
    if (typed.trim().toLowerCase() !== String(name).trim().toLowerCase()) { setErr(`Not deleted: that didn't match "${name}".`); return; }
    setBusy(true); setErr('');
    const r = await pmAttempt(() => pm.deleteRead());
    setBusy(false); if (!r.ok) setErr(r.error);
  };
  const status = !hasRead && s?.read_deleted_at ? `${name}'s read was deleted on ${pmDate(s.read_deleted_at)}.`
    : !on ? `${name} can't see the read yet. Read it through in "Show as client" first, then turn it on.`
    : s.consent_at ? `On. ${name} agreed on ${pmDate(s.consent_at)}${s.delete_requested_at ? `. ${name} asked to delete it on ${pmDate(s.delete_requested_at)}.` : '.'}`
    : `On since ${s.visible_changed_at ? pmDate(s.visible_changed_at) : 'today'}. ${name} is asked to agree before anything shows.`;
  return (
    <div className="surface rounded-xl p-5 flex items-center gap-4 flex-wrap" style={{ borderLeft: `3px solid ${on ? '#34d399' : 'var(--border)'}` }}>
      <span className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ color: on ? '#34d399' : 'var(--text-faint)', background: on ? 'rgba(52,211,153,0.12)' : 'var(--surface-2)' }}><Icon name={on ? 'users' : 'lock'} size={17} /></span>
      <div className="flex-1 min-w-0">
        <p className="font-semibold text-sm">{name}'s own login</p>
        <p className="text-faint text-sm mt-0.5">{status}</p>
        {askedDelete && hasRead && <p className="text-sm mt-1" style={{ color: '#f87171' }}>{name} asked for the read to be deleted on {pmDate(s.delete_requested_at)}.</p>}
        <PmSaveState busy={busy} err={err} />
      </div>
      <div className="flex gap-2 shrink-0 flex-wrap">
        {hasRead && <button disabled={busy} onClick={toggle} className={'px-4 py-1.5 rounded-lg text-sm font-semibold ' + (on ? 'surface' : 'btn-primary')}>{on ? 'Turn off' : `Show ${name} the read`}</button>}
        {hasRead && <button disabled={busy} onClick={del} className={'px-3 py-1.5 rounded-lg text-sm ' + (askedDelete ? 'font-semibold' : 'surface')}
          style={askedDelete ? { background: '#f87171', color: 'white' } : { color: '#f87171' }}>{askedDelete ? 'Delete now' : 'Delete the read'}</button>}
      </div>
    </div>
  );
}

function PmOverview({ data, pm, onNav, isCoach, forceClient }) {
  const [cvSaved, setClientView] = usePmClientView();
  const clientView = !!forceClient || cvSaved;
  const [openKey, setOpenKey] = useState(null);
  if (pm.status === 'loading' || pm.status === 'idle') return <p className="text-faint text-sm">Loading…</p>;
  if (pm.status === 'error') return <p className="text-secondary text-sm">Couldn't load the model: {pm.error}</p>;

  const visible = pm.findings.filter(f => PM_CLIENT_VISIBLE.includes(f.status));
  const candidates = pm.findings.filter(f => f.status === 'candidate');
  const growth = pmGrowth(pm, clientView);
  const proposals = { prediction: pm.predictions.filter(p => p.status === 'proposed').length,
    nudges: pm.interventions.filter(i => i.status === 'proposed' && i.kind === 'nudge').length,
    interventions: pm.interventions.filter(i => i.status === 'proposed' && i.kind !== 'nudge').length, evolution: 0 };
  const proposalCount = proposals.prediction + proposals.nudges + proposals.interventions;
  const pages = pmPages(visible, growth);

                      <div className="flex flex-col gap-1.5">

                          <div key={sec.id} className="flex items-center justify-between gap-2">
                            <button onClick={() => setOpenKey(sec.id === 'evolution' ? 'growth/evolution' : `${col.id}/${sec.id}`)} className="text-sm text-dim hover:text-[var(--text)] text-left">{sec.title}</button>
                            {waitingOf(sec) > 0 && <PmReviewLink n={waitingOf(sec)} to={`/model/review/${col.id}/${sec.id}`} onNav={onNav} chip />}

      </div>

      <PmLegend />

      {page && (
        <PmReader accent={page.col.color} crumbs={[clientView ? 'Your read' : `${name}'s read`, page.col.title, page.sec.title]}
          onClose={() => setOpenKey(null)}
          prev={idx > 0 ? { label: label(pages[idx - 1]), go: () => setOpenKey(pages[idx - 1].key) } : null}
          next={idx < pages.length - 1 ? { label: label(pages[idx + 1]), go: () => setOpenKey(pages[idx + 1].key) } : null}
          footer={page.g && !clientView ? <PmGrowthActions key={page.g.id} g={page.g} type={page.gType} pm={pm} data={data} />

                <PmFindingBody f={page.f} pm={pm} data={data} clientView={clientView} /></>

                <PmEvolutionBody entries={page.evolution} clientView={clientView} /></>
            : <><div className="mb-8"><PmEyebrow color={page.col.color}>{page.col.title}</PmEyebrow><h2 className="text-2xl font-bold">{page.sec.title}</h2></div>
                <PmEmptyBody col={page.col} sec={page.sec} clientView={clientView} onNav={onNav} pending={page.col.id === 'growth' ? (clientView ? 0 : proposals[page.sec.id] || 0) : candidates.filter(pmIn(page.col, page.sec)).length} /></>}
        </PmReader>
      )}
    </div>
  );
}

// ── The client's own read (their login). Everything comes through pm_client_read(), which returns only
// what the client may see, and only once the coach has switched it on and the client has agreed.
const PM_CONSENT_VERSION = 'v1-2026-11';

// Local preview only (?mock=<folder> without coach=1): imitates pm_client_read() from the preview file.
function pmMockClientRead(m, st) {
  if (!st.visible) return { available: false };
  if (!st.consent_at) return { available: true, consented: false };
  const vis = ['confirmed', 'disputed'];
  const live = m.findings.filter(f => vis.includes(f.status));
  const ids = new Set(live.map(f => f.id));
  const confirmedAt = (id) => m.history.find(h => h.finding_id === id && h.field === 'status' && h.after === 'confirmed')?.changed_at;
  return {
    available: true, consented: true, consent_at: st.consent_at, delete_requested_at: st.delete_requested_at || null,
    findings: live.map(f => ({ ...f, code: undefined, coach_framed: undefined, pattern_sequence: (f.pattern_sequence || []).map(x => ({ step: x.step, text: x.text })),
      my_response: [...(f.client_responses || [])].reverse().find(r => r.by === 'client') || null })),
    evidence: m.evidence.filter(e => ids.has(e.finding_id) && e.speaker === 'client').map(e => ({ id: e.id, finding_id: e.finding_id, session_id: e.session_id, quote: e.quote, class: e.class, is_counter: e.is_counter, speaker: 'client' })),
    history: m.history.filter(h => ids.has(h.finding_id) && (h.field === 'created' || (['status', 'confidence', 'scope', 'exceptions', 'statement', 'client_headline'].includes(h.field) && confirmedAt(h.finding_id) && h.changed_at >= confirmedAt(h.finding_id))))
      .map(h => ({ id: h.id, finding_id: h.finding_id, changed_at: h.changed_at, field: h.field, before: ['confidence', 'status'].includes(h.field) ? h.before : null, after: ['confidence', 'status'].includes(h.field) ? h.after : null })),
    predictions: m.predictions.filter(p => p.shared_with_client && ['open', 'scored'].includes(p.status) && p.finding_ids.every(id => ids.has(id))),
    interventions: m.interventions.filter(i => ['active', 'done'].includes(i.status) && ids.has(i.finding_id)),
    sessions_read: [...new Set(m.runs.flatMap(r => r.sessions_read || []))],
  };
}

function useClientRead(enabled) {
  const [state, setState] = useState({ status: 'idle', r: null, error: null });
  const mock = useRef(null);
  const load = useCallback(async () => {
    if (!enabled) return;
    if (MOCK_FOLDER && !MOCK_COACH) {
      if (!mock.current) {
        const res = await fetch(`data/_preview/${MOCK_FOLDER}.pm.json?t=${Date.now()}`);
        const m = res.ok ? await res.json() : null;
        mock.current = { m, st: { visible: !!m, consent_at: null, delete_requested_at: null } };
        if (m) for (const k of ['predictions', 'interventions', 'runs']) m[k] = m[k] || [];
        window.__pmClientMock = mock.current;
      }
      const { m, st } = mock.current;
      setState({ status: 'ready', r: m ? pmMockClientRead(m, st) : { available: false }, error: null });
      return;
    }
    if (!sb) return;
    const { data, error } = await sb.rpc('pm_client_read');
    // An older database without the function, or any error, simply means no read is offered.
    setState({ status: 'ready', r: error ? { available: false } : data, error: error ? error.message : null });
  }, [enabled]);
  useEffect(() => { load(); }, [load]);

  const call = async (fn, args, mockFn) => {
    if (MOCK_FOLDER && !MOCK_COACH) { mockFn(mock.current); await load(); return true; }
    const { error } = await sb.rpc(fn, args);
    if (error) throw new Error(error.message);
    await load();
    return true;
  };
  const consent = () => call('pm_client_consent', { version: PM_CONSENT_VERSION }, (c) => { c.st.consent_at = new Date().toISOString(); });
  const requestDelete = () => call('pm_client_request_delete', {}, (c) => { c.st.delete_requested_at = c.st.delete_requested_at || new Date().toISOString(); });
  const respond = (finding, kind, note) => call('pm_client_respond', { finding, kind, note: note || '' }, (c) => {
    if (kind !== 'agree' && !String(note || '').trim()) throw new Error('Please say what does not fit');
    const f = c.m.findings.find(x => x.id === finding);
    f.client_responses = [...(f.client_responses || []), { kind, text: note || '', at: new Date().toISOString(), by: 'client' }];
    if (kind !== 'agree') f.status = 'disputed';
  });

  // Shape it like usePersonModel so the same page and reader render it.
  const pm = useMemo(() => {
    const r = state.r;
    if (!r || !r.consented) return null;
    const ev = {}, hi = {};
    r.evidence.forEach(e => { (ev[e.finding_id] = ev[e.finding_id] || []).push(e); });
    r.history.forEach(h => { (hi[h.finding_id] = hi[h.finding_id] || []).push(h); });
    return {
      status: 'ready', error: null,
      findings: r.findings.map(f => ({ ...f, code: '', domains: f.domains || [] })),
      evidence: r.evidence, history: r.history, predictions: r.predictions, interventions: r.interventions,
      growthHistory: [], settings: null,
      runs: [{ sessions_read: r.sessions_read || [], created_at: null }],
      evidenceFor: id => ev[id] || [], historyFor: id => hi[id] || [], growthHistoryFor: () => [],
      respond,
    };
  }, [state.r]);

  return { ...state, available: !!state.r?.available, consented: !!state.r?.consented, pm, consent, requestDelete, respond, reload: load };
}

// Shown once, before anything else. Nothing of the read is loaded until the client agrees.
function PmConsent({ name, cr }) {
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const agree = async () => { setBusy(true); setErr(''); const r = await pmAttempt(() => cr.consent()); setBusy(false); if (!r.ok) setErr(r.error); };
  const points = [
    ['What it is', 'A picture of how you operate, built from the transcripts of our sessions. It describes patterns, not who you are.'],
    ['Who has checked it', 'Dhiren reads and confirms every part of it before you see it. Each part shows the moments it rests on, in your own words, and how sure we are.'],
    ['Your say', 'If something doesn\'t fit, tell us right there. Your answer goes to Dhiren, and the read changes. Some parts are put to you as questions, because only you can settle them.'],
    ['Who can see it', 'Only you and Dhiren. You can download it whenever you like, and ask for it to be deleted at any time.'],
  ];
  return (
    <div className="fade-in max-w-2xl">
      <p className="text-faint text-xs tracking-[0.2em] mb-2">YOUR READ</p>
      <h1 className="text-3xl md:text-4xl font-bold mb-3">Before you open it</h1>
      <p className="text-secondary italic reading mb-8" style={{ fontSize: '17px' }}>A few things to know, {name}.</p>
      <div className="space-y-3 mb-8">
        {points.map(([t, b], i) => (
          <div key={t} className="surface rounded-xl p-5 flex gap-4 items-start">
            <span className="w-8 h-8 rounded-full flex items-center justify-center font-bold flex-shrink-0 text-white" style={{ background: 'var(--primary)' }}>{i + 1}</span>
            <div><h3 className="font-semibold">{t}</h3><p className="text-dim reading mt-1" style={{ fontSize: '15px' }}>{b}</p></div>
          </div>
        ))}
      </div>
      <div className="flex items-center gap-4 flex-wrap">
        <button disabled={busy} onClick={agree} className="btn-primary px-5 py-2.5 rounded-lg font-semibold">I understand. Show me my read</button>
        <PmSaveState busy={busy} err={err} />
      </div>
      <p className="text-faint text-xs mt-4">Not ready? You can come back to this any time from your Overview.</p>
    </div>
  );
}

// The client's response to one finding: agree, say it doesn't fit, or correct a fact.
const PM_RESPONSE_WORDS = { agree: 'You said this fits', dispute: 'You said this doesn\'t fit', correct: 'You corrected a fact' };
function PmRespond({ f, pm }) {
  const [mode, setMode] = useState(null);
  const [note, setNote] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const send = async (kind) => {
    setBusy(true); setErr('');
    const r = await pmAttempt(() => pm.respond(f.id, kind, note.trim()));
    setBusy(false);
    if (r.ok) { setMode(null); setNote(''); } else setErr(r.error);
  };
  const mine = f.my_response;
  return (
    <div>
      {mine && !mode && <p className="text-xs text-faint mb-2">{PM_RESPONSE_WORDS[mine.kind]} on {pmDate(mine.at)}{mine.text ? `: "${mine.text}"` : '.'}{f.status === 'disputed' ? ' Dhiren is looking at it.' : ''}</p>}
      {mode && (
        <div className="mb-3 flex gap-2 flex-wrap">
          <textarea autoFocus className="input flex-1" rows={2} style={{ minWidth: 220 }} value={note} onChange={e => setNote(e.target.value)}
            placeholder={mode === 'dispute' ? 'What doesn\'t fit? A sentence is enough.' : 'What is the fact, as it actually was?'} />
          <button disabled={busy || !note.trim()} onClick={() => send(mode)} className="btn-primary px-4 py-2 rounded-lg text-sm font-semibold" style={{ opacity: note.trim() ? 1 : 0.5 }}>Send to Dhiren</button>
        </div>
      )}
      <div className="flex flex-wrap gap-2 items-center">
        <button disabled={busy} onClick={() => send('agree')} className="surface px-3 py-1.5 rounded-lg text-sm">This fits</button>
        <button disabled={busy} onClick={() => setMode(mode === 'dispute' ? null : 'dispute')} className={'px-3 py-1.5 rounded-lg text-sm ' + (mode === 'dispute' ? 'btn-primary' : 'surface')}>This isn't right</button>
        <button disabled={busy} onClick={() => setMode(mode === 'correct' ? null : 'correct')} className={'px-3 py-1.5 rounded-lg text-sm ' + (mode === 'correct' ? 'btn-primary' : 'surface')}>Correct a fact</button>
        <PmSaveState busy={busy} err={err} />
      </div>
    </div>
  );
}

// "Download my read": a plain, printable page the client can save as a PDF.
function pmPrintRead(pm, data, name) {
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const visible = pm.findings.filter(f => PM_CLIENT_VISIBLE.includes(f.status));
  const read = pmReadInfo(pm);
  const growth = pmGrowth(pm, true);
  let body = `<h1>Your read</h1><p class="sub">Downloaded ${pmDate(new Date().toISOString())}.</p>`;
  for (const col of PM_COLUMNS.filter(c => c.id !== 'growth')) {
    const fs = visible.filter(f => pmPlace(f).startsWith(col.id + '/')).sort(pmSort);
    if (!fs.length) continue;
    body += `<h2>${esc(col.title)}</h2>`;
    for (const f of fs) {
      const qs = pm.evidenceFor(f.id).filter(e => !e.is_counter).slice(0, 3);
      body += `<div class="f"><p class="tag">${esc(PM_CONF_LABEL[f.confidence])}${f.status === 'disputed' ? ' · under review' : ''}</p><h3>${esc(pmHeadline(f))}</h3><p>${esc(f.statement)}</p>`
        + (f.mechanism ? `<p><b>What explains it:</b> ${esc(f.mechanism)}</p>` : '')
        + (f.exceptions ? `<p><b>Exceptions:</b> ${esc(f.exceptions)}</p>` : '')
        + qs.map(e => `<blockquote>"${esc(e.quote)}"<span>${esc(pmSessionLabel(data, e.session_id))}</span></blockquote>`).join('') + `</div>`;
    }
  }
  const items = [...growth.prediction.map(p => ['Prediction', p.situation, p.expected]), ...[...growth.nudges, ...growth.interventions].map(i => [PM_KIND[i.kind], i.opportunity, i.action])];
  if (items.length) body += `<h2>My Growth</h2>` + items.map(([k, t, d]) => `<div class="f"><p class="tag">${esc(k)}</p><h3>${esc(t)}</h3><p>${esc(d)}</p></div>`).join('');
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>Your read · ${esc(name)}</title><style>
    body{font-family:Georgia,serif;max-width:720px;margin:40px auto;padding:0 24px;color:#1c1729;line-height:1.55}
    h1{font-family:-apple-system,Helvetica,sans-serif;font-size:30px;margin:0 0 4px}h2{font-family:-apple-system,Helvetica,sans-serif;font-size:18px;margin:36px 0 12px;padding-left:10px;border-left:3px solid #7e3af2}
    h3{font-family:-apple-system,Helvetica,sans-serif;font-size:16px;margin:2px 0 6px}.sub{color:#92400e;font-style:italic}.tag{font-family:-apple-system,Helvetica,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7e3af2;margin:0}
    .f{page-break-inside:avoid;margin:0 0 22px}blockquote{margin:8px 0;padding-left:12px;border-left:2px solid #92400e;font-style:italic}blockquote span{display:block;font-style:normal;font-size:12px;color:#5b5470}
    @media print{body{margin:0}}</style></head><body>${body}</body></html>`;
  const w = window.open('', '_blank');
  if (!w) { alert('Your browser blocked the download window. Allow pop-ups for this page and try again.'); return; }
  w.document.open(); w.document.write(html); w.document.close();
  setTimeout(() => { try { w.focus(); w.print(); } catch {} }, 300);
}

function PmClientRead({ data, cr, onNav }) {
  const name = data.profile?.preferredName || (data.profile?.name || '').split(' ')[0];
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  if (cr.status !== 'ready') return <p className="text-faint text-sm">Loading…</p>;
  if (!cr.available) return (
    <div className="surface rounded-2xl p-8 text-center fade-in"><p className="text-dim reading">Your read isn't available yet. Dhiren will let you know when it is.</p>
      <button onClick={() => onNav('/overview')} className="text-primary text-sm mt-2">Back to your Overview</button></div>
  );
  if (!cr.consented) return <PmConsent name={name} cr={cr} />;
  const askDelete = async () => {
    if (!window.confirm('Ask Dhiren to delete your read?\n\nYour read stays visible until Dhiren has deleted it.')) return;
    setBusy(true); setErr(''); const r = await pmAttempt(() => cr.requestDelete()); setBusy(false); if (!r.ok) setErr(r.error);
  };
  return (
    <div className="space-y-10">
      <PmOverview data={data} pm={cr.pm} onNav={onNav} isCoach={false} forceClient />
      <div className="surface rounded-2xl p-5 flex items-center gap-3 flex-wrap">
        <div className="flex-1 min-w-0">
          <p className="font-semibold text-sm">Your copy, your choice</p>
          <p className="text-faint text-sm mt-0.5">{cr.r.delete_requested_at ? `You asked for your read to be deleted on ${pmDate(cr.r.delete_requested_at)}. Dhiren will take care of it.` : 'Download your read to keep, or ask for it to be deleted.'}</p>
          <PmSaveState busy={busy} err={err} />
        </div>
        <button onClick={() => pmPrintRead(cr.pm, data, name)} className="btn-primary px-4 py-1.5 rounded-lg text-sm font-semibold">Download my read</button>
        {!cr.r.delete_requested_at && <button disabled={busy} onClick={askDelete} className="surface px-3 py-1.5 rounded-lg text-sm" style={{ color: '#f87171' }}>Ask to delete</button>}
      </div>
    </div>
  );
}

// disputed: the client said it doesn't fit or corrected a fact. Keep, reword, or retire (framework: Under review).
function PmReviewActions({ f, pm, onDone, disputed }) {
  const [mode, setMode] = useState(null); // 'reword' | 'reject' | 'merge'
  const [draft, setDraft] = useState({ client_headline: f.client_headline, client_question: f.client_question || '', statement: f.statement, confidence: f.confidence, importance: f.importance });
  const [reason, setReason] = useState('');
  const [target, setTarget] = useState('');
  const [busy, setBusy] = useState(false);
  const targets = pm.findings.filter(x => x.id !== f.id && ['confirmed', 'disputed', 'candidate'].includes(x.status));
  const [err, setErr] = useState('');
  const run = async (fn, leaves) => { setBusy(true); setErr(''); const r = await pmAttempt(fn); setBusy(false); if (r.ok) { setMode(null); if (leaves) onDone(); } else setErr(r.error); };
  const changed = () => {
    const p = {};
    for (const k of Object.keys(draft)) {
      const v = k === 'client_question' ? (draft[k].trim() || null) : draft[k];
      if (v !== (f[k] ?? null)) p[k] = v;
    }
    return p;
  };

  return (
    <div>
      {mode === 'reword' && (
        <div className="mb-3 space-y-2 max-h-[40vh] overflow-y-auto pr-1">
          <label className="block text-xs text-faint">Client headline<input className="input mt-1" value={draft.client_headline} onChange={e => setDraft({ ...draft, client_headline: e.target.value })} /></label>
          <label className="block text-xs text-faint">As a question (shown while confidence is Thin)<input className="input mt-1" value={draft.client_question} onChange={e => setDraft({ ...draft, client_question: e.target.value })} /></label>
          <label className="block text-xs text-faint">What happens<textarea className="input mt-1" rows={3} value={draft.statement} onChange={e => setDraft({ ...draft, statement: e.target.value })} /></label>
          <div className="flex gap-3 flex-wrap items-end">
            <label className="text-xs text-faint">Confidence
              <select className="input mt-1" value={draft.confidence} onChange={e => setDraft({ ...draft, confidence: e.target.value })}>{['thin', 'live', 'solid'].map(c => <option key={c} value={c}>{c}</option>)}</select>
            </label>
            <label className="text-xs text-faint">Importance
              <select className="input mt-1" value={draft.importance} onChange={e => setDraft({ ...draft, importance: e.target.value })}>{['high', 'medium', 'low'].map(c => <option key={c} value={c}>{c}</option>)}</select>
            </label>
            <button disabled={busy} onClick={() => run(() => pm.update(f.id, changed(), 'Reworded by coach'), false)} className="text-sm text-primary pb-2">Save wording, keep as candidate</button>
          </div>
        </div>
      )}
      {mode === 'reject' && (
        <div className="mb-3 flex gap-2 flex-wrap">
          <input autoFocus className="input flex-1" style={{ minWidth: 220 }} placeholder="Why? (kept, so the same reading isn't proposed again)" value={reason} onChange={e => setReason(e.target.value)} />
          <button disabled={busy || !reason.trim()} onClick={() => run(() => pm.update(f.id, { status: disputed ? 'retired' : 'rejected', reject_reason: reason.trim() }, reason.trim()), true)}
            className="px-4 py-2 rounded-lg text-sm font-semibold" style={{ background: '#f87171', color: 'white', opacity: reason.trim() ? 1 : 0.5 }}>{disputed ? 'Retire' : 'Reject'}</button>
        </div>
      )}
      {mode === 'merge' && (
        <div className="mb-3 flex gap-2 flex-wrap">
          <select className="input flex-1" style={{ minWidth: 220 }} value={target} onChange={e => setTarget(e.target.value)}>
            <option value="">Merge into…</option>
            {targets.map(t => <option key={t.id} value={t.id}>{t.code} · {t.client_headline} ({t.status})</option>)}
          </select>
          <button disabled={busy || !target} onClick={() => run(() => pm.merge(f.id, target, `Merged ${f.code} in review`), true)}
            className="btn-primary px-4 py-2 rounded-lg text-sm font-semibold" style={{ opacity: target ? 1 : 0.5 }}>Merge</button>
          <p className="text-faint text-xs w-full">Its evidence moves to the other finding. This record is kept, marked as merged.</p>
        </div>
      )}
      <div className="flex flex-wrap gap-2 items-center">
        <button disabled={busy} onClick={() => run(() => pm.update(f.id, { ...changed(), status: 'confirmed' }, disputed ? (mode === 'reword' ? 'Reworded after the client\'s response' : 'Kept after the client\'s response') : mode === 'reword' ? 'Reworded and confirmed by coach' : 'Confirmed by coach'), true)}
          className="btn-primary px-4 py-1.5 rounded-lg text-sm font-semibold">{mode === 'reword' ? 'Save and confirm' : disputed ? 'Keep as is' : 'Confirm'}</button>
        <button disabled={busy} onClick={() => setMode(mode === 'reword' ? null : 'reword')} className={'px-3 py-1.5 rounded-lg text-sm ' + (mode === 'reword' ? 'btn-primary' : 'surface')}>Reword</button>
        {!disputed && <button disabled={busy} onClick={() => setMode(mode === 'merge' ? null : 'merge')} className={'px-3 py-1.5 rounded-lg text-sm ' + (mode === 'merge' ? 'btn-primary' : 'surface')}>Merge</button>}
        <button disabled={busy} onClick={() => setMode(mode === 'reject' ? null : 'reject')} className="surface px-3 py-1.5 rounded-lg text-sm" style={{ color: '#f87171' }}>{disputed ? 'Retire' : 'Reject'}</button>
        <PmSaveState busy={busy} err={err} />
        <span className="text-faint text-xs ml-auto hidden md:inline">{disputed ? 'Keeping or rewording clears "under review" for the client' : 'Confirming shows it to the client'}</span>
      </div>
    </div>
  );
}

// Growth proposals, optionally only those for one Growth section (prediction / nudges / interventions).
function pmGrowthProposals(pm, secId) {
  const all = [
    ...pm.predictions.filter(p => p.status === 'proposed').map(g => ({ g, type: 'prediction' })),
    ...pm.interventions.filter(i => i.status === 'proposed').map(g => ({ g, type: 'intervention' })),
  ];
  if (!secId) return all;
  return all.filter(x => secId === 'prediction' ? x.type === 'prediction'
    : secId === 'nudges' ? x.type === 'intervention' && x.g.kind === 'nudge'
    : secId === 'interventions' ? x.type === 'intervention' && x.g.kind !== 'nudge' : false);
}
const pmSectionOf = (section) => {
  if (!section) return null;
  const [colId, secId] = section.split('/');
  const col = PM_COLUMNS.find(c => c.id === colId);
  const sec = (colId === 'growth' ? PM_GROWTH_SECTIONS : PM_SECTIONS[colId] || []).find(x => x.id === secId);
  return col && sec ? { colId, secId, col, sec } : null;
};

// section: "insights/gaps", "growth/nudges", … when opened from a section's "to review" link. Then only that
// section's items are listed and the first one opens straight away; previous / next stay within the section.
function PmReviewView({ data, pm, isCoach, onNav, section }) {
  const [clientView, setClientView] = usePmClientView();
  const [openId, setOpenId] = useState(null);
  const [showClosed, setShowClosed] = useState(false);
  const [openG, setOpenG] = useState(null);
  const [openD, setOpenD] = useState(null);
  const order = useRef([]);
  const only = pmSectionOf(section);
  const autoOpened = useRef(false);
  useEffect(() => {
    if (!only || pm.status !== 'ready' || autoOpened.current) return;
    autoOpened.current = true;
    if (only.colId === 'growth') { const first = pmGrowthProposals(pm, only.secId)[0]; if (first) setOpenG(first.g.id); return; }
    const q = pm.findings.filter(f => f.status === 'candidate' && pmPlace(f) === section).sort(pmSort);
    if (q[0]) { order.current = q.map(f => f.id); setOpenId(q[0].id); }
  }, [section, pm.status]);
  if (pm.status === 'loading' || pm.status === 'idle') return <p className="text-faint text-sm">Loading…</p>;
  if (pm.status === 'error') return <p className="text-secondary text-sm">Couldn't load the model: {pm.error}</p>;

  const gQueue = !only ? pmGrowthProposals(pm) : only.colId === 'growth' ? pmGrowthProposals(pm, only.secId) : [];
  const gi = gQueue.findIndex(x => x.g.id === openG);
  const gOpen = gi >= 0 ? gQueue[gi] : null;
  const gWaits = ({ g, type }) => (type === 'prediction' ? pmFindingsOf(pm, g) : [pm.findings.find(f => f.id === g.finding_id)].filter(Boolean)).filter(f => f.status !== 'confirmed');
  const showFindings = !only || only.colId !== 'growth';
  const queue = pm.findings.filter(f => f.status === 'candidate' && (!only || pmPlace(f) === section)).sort(pmSort);
  const closed = pm.findings.filter(f => ['rejected', 'merged', 'retired'].includes(f.status));
  const disputedList = only ? [] : pm.findings.filter(f => f.status === 'disputed').sort(pmSort);
  const di = disputedList.findIndex(f => f.id === openD);
  const dOpen = di >= 0 ? disputedList[di] : null;
  const lastWord = (f) => [...(f.client_responses || [])].reverse().find(r => r.by === 'client');
  const confirmed = pm.findings.filter(f => f.status === 'confirmed').length;
  const open = pm.findings.find(f => f.id === openId);
  const qi = queue.findIndex(f => f.id === openId);
  const openAt = (id) => { order.current = queue.map(f => f.id); setOpenId(id); };
  // After an action the finding leaves the queue: move on to the next one in the order it was opened from.
  const advance = () => {
    const ids = order.current, at = ids.indexOf(openId);
    const nextId = ids.slice(at + 1).find(id => pm.findings.find(f => f.id === id)) || null;
    setOpenId(nextId);
  };

  if (clientView) return (
    <div className="fade-in">
      <PmHeader eyebrow="PERSON MODEL" title="Review Queue" clientView={clientView} setClientView={setClientView} isCoach={isCoach} />
      <div className="surface rounded-2xl p-8 text-center"><p className="text-dim reading">The review queue is coach-only. Open the model to see the client view.</p></div>
    </div>
  );

  return (
    <div className="fade-in">
      <PmHeader eyebrow={only ? `PERSON MODEL · COACH · ${only.col.title.toUpperCase()}` : 'PERSON MODEL · COACH'} title={only ? `Review: ${only.sec.title}` : 'Review Queue'}
        sub={only ? `Only this section's items. ${only.colId === 'growth' ? 'Accept' : 'Confirm'} or reject each one and the next opens.` : 'Candidates Claude proposed from the transcripts, most important first. Open one to read it exactly as the client would, then confirm, reword, merge or reject.'}
        clientView={clientView} setClientView={setClientView} isCoach={isCoach} />
      {only && (
        <div className="flex gap-4 mb-5 text-sm">
          <button onClick={() => onNav('/model/overview')} className="text-primary">← Back to the model</button>
          <button onClick={() => onNav('/model/review')} className="text-faint">Show the whole queue</button>
        </div>
      )}
      <div className="grid grid-cols-3 gap-3 mb-6">
        {[[queue.length + gQueue.length, 'To review', 'var(--secondary)'], [confirmed, 'Confirmed'], [closed.length, 'Rejected / merged']].map(([v, l, c]) => (
          <div key={l} className="surface rounded-xl px-4 py-3"><div className="text-3xl font-light" style={{ color: c || 'var(--text)' }}>{v}</div><div className="text-[10px] tracking-[0.18em] text-faint mt-1 uppercase">{l}</div></div>
        ))}
      </div>

      {only && queue.length === 0 && gQueue.length === 0
        ? <div className="surface rounded-2xl p-8 text-center"><p className="text-dim reading">Nothing left to review in {only.sec.title}.</p>
            <button onClick={() => onNav('/model/overview')} className="text-primary text-sm mt-2">Back to the model</button></div>
        : !showFindings ? null
        : queue.length === 0
        ? <div className="surface rounded-2xl p-8 text-center"><p className="text-dim reading">No findings waiting. Run the person-model pass in Claude Code to propose candidates.</p>
            {confirmed > 0 && <button onClick={() => onNav('/model/overview')} className="text-primary text-sm mt-2">Open the model</button>}</div>
        : <div className="surface rounded-2xl p-2">
            {queue.map((f, i) => (
              <button key={f.id} onClick={() => openAt(f.id)} className="w-full text-left rounded-xl px-4 py-3 hover:bg-primary-soft transition flex gap-4 items-start" style={i ? { borderTop: '1px solid var(--border)' } : {}}>
                <span className="text-faint text-xs font-mono pt-1 shrink-0 w-12">{f.code}</span>
                <div className="flex-1 min-w-0">
                  <p className={'leading-snug ' + (f.confidence === 'thin' ? 'italic' : '')}>{pmHeadline(f)}</p>
                  <p className="text-faint text-xs mt-1">{PM_LENS[f.lens]} · {PM_TYPES[f.type]} · {f.domains.map(d => PM_DOMAINS[d]).join(', ')}</p>
                </div>
                <div className="flex gap-1.5 shrink-0 pt-0.5">
                  <PmChip color={PM_IMP_COLOR[f.importance]}>{f.importance}</PmChip>
                  <PmChip color={PM_CONF_COLOR[f.confidence]}>{f.confidence}</PmChip>
                </div>
              </button>
            ))}
          </div>}

      {gQueue.length > 0 && (
        <div className="mt-8">
          <PmEyebrow color="#34d399">Growth proposals · {gQueue.length}</PmEyebrow>
          <p className="text-faint text-xs mb-3">Predictions and interventions. Each can be accepted once the findings it rests on are confirmed.</p>
          <div className="surface rounded-2xl p-2">
            {gQueue.map((x, i) => {
              const waits = gWaits(x);
              return (
                <button key={x.g.id} onClick={() => setOpenG(x.g.id)} className="w-full text-left rounded-xl px-4 py-3 hover:bg-primary-soft transition flex gap-4 items-start" style={i ? { borderTop: '1px solid var(--border)' } : {}}>
                  <span className="text-faint text-xs font-mono pt-1 shrink-0 w-12">{x.g.code}</span>
                  <div className="flex-1 min-w-0">
                    <p className="leading-snug">{x.type === 'prediction' ? x.g.situation : x.g.opportunity}</p>
                    <p className="text-faint text-xs mt-1">{x.type === 'prediction' ? `Prediction for ${pmShortDate(x.g.situation_date)}` : PM_KIND[x.g.kind]} · rests on {(x.type === 'prediction' ? pmFindingsOf(pm, x.g) : [pm.findings.find(f => f.id === x.g.finding_id)].filter(Boolean)).map(f => f.code).join(', ')}</p>
                  </div>
                  <div className="flex gap-1.5 shrink-0 pt-0.5">
                    {waits.length ? <PmChip>Waits for {waits.map(f => f.code).join(', ')}</PmChip> : <PmChip color="#34d399">Ready</PmChip>}
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      )}

      {gOpen && (
        <PmReader crumbs={['Review Queue', only ? only.sec.title : 'Growth', gOpen.g.code, `${gi + 1} of ${gQueue.length}`]} onClose={() => setOpenG(null)}
          prev={gi > 0 ? { label: gQueue[gi - 1].g.code, go: () => setOpenG(gQueue[gi - 1].g.id) } : null}
          next={gi < gQueue.length - 1 ? { label: gQueue[gi + 1].g.code, go: () => setOpenG(gQueue[gi + 1].g.id) } : null}
          footer={<PmGrowthReviewActions key={gOpen.g.id} g={gOpen.g} type={gOpen.type} pm={pm} onDone={() => setOpenG(gQueue[gi + 1]?.g.id || null)} />}>
          <PmGrowthTitle g={gOpen.g} type={gOpen.type} clientView={false} color="#34d399" eyebrow={gOpen.type === 'prediction' ? 'Proposed prediction' : `Proposed ${PM_KIND[gOpen.g.kind].toLowerCase()}`} />
          {gOpen.type === 'prediction' ? <PmPredictionBody p={gOpen.g} pm={pm} clientView={false} /> : <PmInterventionBody i={gOpen.g} pm={pm} clientView={false} />}
        </PmReader>
      )}

      {!only && closed.length > 0 && (
        <div className="mt-8">
          <button onClick={() => setShowClosed(!showClosed)} className="text-sm text-faint">{showClosed ? 'Hide' : 'Show'} rejected and merged ({closed.length})</button>
          {showClosed && (
            <div className="space-y-2 mt-3">
              {closed.map(f => (
                <div key={f.id} className="surface-2 rounded-lg p-3 text-sm">
                  <span className="text-faint font-mono text-xs mr-2">{f.code}</span>
                  <span className="text-dim">{f.client_headline}</span>
                  <span className="text-faint"> · {f.status === 'merged' ? `merged into ${pm.findings.find(x => x.id === f.merged_into)?.code || '?'}` : `rejected: ${f.reject_reason}`}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {disputedList.length > 0 && (
        <div className="mt-8">
          <PmEyebrow color="#f87171">The client's responses · {disputedList.length}</PmEyebrow>
          <p className="text-faint text-xs mb-3">Findings the client said don't fit, or where they corrected a fact. They stay visible to the client, marked under review, until you keep, reword or retire them.</p>
          <div className="surface rounded-2xl p-2">
            {disputedList.map((f, i) => {
              const w = lastWord(f);
              return (
                <button key={f.id} onClick={() => setOpenD(f.id)} className="w-full text-left rounded-xl px-4 py-3 hover:bg-primary-soft transition flex gap-4 items-start" style={i ? { borderTop: '1px solid var(--border)' } : {}}>
                  <span className="text-faint text-xs font-mono pt-1 shrink-0 w-12">{f.code}</span>
                  <div className="flex-1 min-w-0">
                    <p className="leading-snug">{pmHeadline(f)}</p>
                    {w && <p className="text-sm mt-1 italic" style={{ color: '#f87171' }}>{PM_RESPONSE_WORDS[w.kind].replace('You', 'Client')}{w.text ? `: "${w.text}"` : ''} <span className="text-faint not-italic text-xs">· {pmDate(w.at)}</span></p>}
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      )}

      {dOpen && (
        <PmReader crumbs={['Review Queue', 'Client responses', dOpen.code]} onClose={() => setOpenD(null)}
          prev={di > 0 ? { label: disputedList[di - 1].code, go: () => setOpenD(disputedList[di - 1].id) } : null}
          next={di < disputedList.length - 1 ? { label: disputedList[di + 1].code, go: () => setOpenD(disputedList[di + 1].id) } : null}
          footer={<PmReviewActions key={dOpen.id} f={dOpen} pm={pm} disputed onDone={() => setOpenD(disputedList[di + 1]?.id || null)} />}>
          <PmFindingTitle f={dOpen} clientView={false} eyebrow="Under review · the client responded" color="#f87171" />
          <PmFindingBody f={dOpen} pm={pm} data={data} clientView={false} />
        </PmReader>
      )}

      {open && open.status === 'candidate' && (
        <PmReader crumbs={['Review Queue', ...(only ? [only.sec.title] : []), `${open.code}`, `${qi + 1} of ${queue.length}`]} onClose={() => setOpenId(null)}
          prev={qi > 0 ? { label: `${queue[qi - 1].code}`, go: () => setOpenId(queue[qi - 1].id) } : null}
          next={qi >= 0 && qi < queue.length - 1 ? { label: `${queue[qi + 1].code}`, go: () => setOpenId(queue[qi + 1].id) } : null}
          footer={<PmReviewActions key={open.id} f={open} pm={pm} onDone={advance} />}>
          <PmFindingTitle f={open} clientView={false} eyebrow={`Candidate · ${PM_LENS[open.lens]}`} color="var(--secondary)" />
          <PmFindingBody f={open} pm={pm} data={data} clientView={false} />
        </PmReader>
      )}
    </div>
  );
}

function AppShell({ data, signOut, updateProfileField, updateData, coachees, coacheeId, activeFolder, setActiveFolder, authedEmail }) {
  const [kpiCount, setKpiCount] = useState(0);
  useEffect(() => {
    let cancelled = false;
    if (!sb || !coacheeId) { setKpiCount(0); return; }
    sb.from('kpi_definitions').select('id', { count: 'exact', head: true })
      .eq('coachee_id', coacheeId).eq('active', true)
      .then(({ count }) => { if (!cancelled) setKpiCount(count || 0); });
    return () => { cancelled = true; };
  }, [coacheeId]);
  const showKpis = kpiCount > 0 || isCoachEmail(authedEmail);
  const [route, go] = useHashRoute();
  useActivityTracking(coacheeId, authedEmail, route);
  const isCoach = isCoachEmail(authedEmail);
  const prep = usePreps(coacheeId);
  const pm = usePersonModel(coacheeId, isCoach);
  const clientRead = useClientRead(!isCoach);
  // Magic-link sign-in drops the URL hash, so a reminder-email link to #/prep
  // is remembered before login (see App) and resumed here.
  useEffect(() => {
    let target = null;
    try { target = localStorage.getItem('ig-after-login'); localStorage.removeItem('ig-after-login'); } catch {}
    if (target) go(target);
  }, []);
  const [theme, toggleTheme] = useTheme();
  const [searchOpen, setSearchOpen] = useState(false);
  const [actionItems, cycleStatus] = useActionStatus(data, updateData);
  const [priorities, cyclePriority] = usePriorityStatus(data, updateData);
  const allSessionIds = useMemo(() => data.sessions.map(s => s.id), [data]);
  const { viewed, markViewed, unviewedCount, unviewedIds } = useViewedSessions(data.id, allSessionIds);

  const searchIndex = useMemo(() => buildSearchIndex(data), [data]);

  // ⌘K shortcut
  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); setSearchOpen(true); }
      if (e.key === 'Escape') setSearchOpen(false);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  // Determine active tab
  const activeId = useMemo(() => {
    const seg = route.split('/')[1];
    if (seg === 'session') return 'sessions';
    if (seg === 'resource') return 'resources';
    if (seg === 'next') return 'next';
    if (seg === 'financials') return 'financials';
    if (seg === 'model') return route.split('/')[2] === 'review' ? 'model-review' : 'model-overview';
    if (!seg) return 'overview';
    return seg;
  }, [route]);

  // Render view
  const view = useMemo(() => {
    const parts = route.split('/').filter(Boolean);
    const seg = parts[0] || 'overview';
    if (seg === 'overview') return <OverviewView data={data} onNav={go} actionItems={actionItems} updateProfileField={updateProfileField} prep={prep} isCoach={isCoach} readAvailable={clientRead.available && !isCoach} readConsented={clientRead.consented} />;
    if (seg === 'prep') return <PrepView prep={prep} isCoach={isCoach} />;
    if (seg === 'sessions') return <SessionsView data={data} onNav={go} route={route} unviewedIds={unviewedIds} authedEmail={authedEmail} />;
    if (seg === 'session' && parts[1]) return <SessionDetailView data={data} sessionId={parts[1]} onNav={go} actionItems={actionItems} cycleStatus={cycleStatus} markViewed={markViewed} authedEmail={authedEmail} activeFolder={activeFolder} />;
    if (seg === 'actions') return <ActionItemsView data={data} actionItems={actionItems} cycleStatus={cycleStatus} />;
    if (seg === 'growth') return <GrowthView data={data} />;
    if (seg === 'scorecard') return <ScorecardView data={data} />;
    if (seg === 'next') return <NextQuarterView data={data} priorities={priorities} cyclePriority={cyclePriority} />;
    if (seg === 'resources') return <ResourcesView data={data} onNav={go} />;
    if (seg === 'resource' && parts[1]) return <ResourceDetailView data={data} resourceId={parts[1]} onNav={go} />;
    if (seg === 'journal') return <JournalView data={data} updateData={updateData} onNav={go} />;
    if (seg === 'messages') return <MessagesView data={data} />;
    if (seg === 'notes') return <NotesView data={data} />;
    if (seg === 'financials') return <FinancialsView data={data} />;
    if (seg === 'kpis') return <KpisView coacheeId={coacheeId} authedEmail={authedEmail} />;
    if (seg === 'model' && isCoach && parts[1] === 'review') {
      const section = parts[2] && parts[3] ? `${parts[2]}/${parts[3]}` : null;
      return <PmReviewView key={section || 'all'} section={section} data={data} pm={pm} isCoach={isCoach} onNav={go} />;
    }
    if (seg === 'model' && isCoach) return <PmOverview data={data} pm={pm} isCoach={isCoach} onNav={go} />;
    if (seg === 'read' && !isCoach) return <PmClientRead data={data} cr={clientRead} onNav={go} />;
    if (seg === 'engagement' && isCoach) return <EngagementView onOpen={(folder) => { setActiveFolder(folder); go('/overview'); }} />;
    return <OverviewView data={data} onNav={go} actionItems={actionItems} updateProfileField={updateProfileField} prep={prep} isCoach={isCoach} />;
  }, [route, data, actionItems, priorities, coacheeId, authedEmail, prep, pm, clientRead]);

  return (
    <div className="flex min-h-screen">
      <Sidebar activeId={activeId} onNav={go} onSignOut={signOut} profile={data.profile} badges={{ sessions: unviewedCount, 'model-review': isCoach ? pm.findings.filter(f => ['candidate', 'disputed'].includes(f.status)).length : 0 }} data={data} showKpis={showKpis} isCoach={isCoach} readAvailable={clientRead.available} />
      <div className="flex-1 flex flex-col main-content min-w-0">
        <TopBar profile={data.profile} onSearch={() => setSearchOpen(true)} onToggleTheme={toggleTheme} theme={theme} coachees={coachees} activeFolder={activeFolder} setActiveFolder={setActiveFolder} />
        <main className="flex-1 p-5 md:p-10 overflow-y-auto" key={route}>
          <div className="max-w-5xl mx-auto">
            {view}
            <p className="text-faint text-xs text-center mt-16 pb-4">Developed by InnerGame Consulting</p>
          </div>
        </main>
      </div>
      <MobileBottomNav activeId={activeId} onNav={go} />
      {searchOpen && <SearchOverlay onClose={() => setSearchOpen(false)} index={searchIndex} onNav={go} />}
    </div>
  );
}

/* =====================================================================
   ROOT APP
   ===================================================================== */
function App() {
  const { session, loading, sendMagicLink, verifyEmailOtp, signInWithProvider, signOut, authedEmail } = useAuth();
  const { data, error, updateProfileField, updateData, coachees, coacheeId, activeFolder, setActiveFolder } = useCoacheeData(authedEmail);

  if (loading) return (
    <div className="min-h-screen flex items-center justify-center">
      <p className="text-faint text-sm">Loading…</p>
    </div>
  );

  if (!session) {
    if (window.location.hash.startsWith('#/prep')) {
      try { localStorage.setItem('ig-after-login', '/prep'); } catch {}
    }
    return <LoginScreen sendMagicLink={sendMagicLink} verifyEmailOtp={verifyEmailOtp} signInWithProvider={signInWithProvider} />;
  }

  if (error === 'NO_DASHBOARD') return (
    <div className="login-bg min-h-screen flex flex-col items-center justify-center p-6">
      <div className="surface rounded-2xl p-10 max-w-md text-center">
        <div className="mb-3 text-faint flex justify-center"><Icon name="lock" size={36} strokeWidth={1.25} /></div>
        <h2 className="font-semibold text-lg mb-2">No dashboard for this email yet.</h2>
        <p className="text-faint text-sm mb-6 reading">You're signed in as <strong>{authedEmail}</strong>, but there's no coachee record under this address. Reach Dhiren if this is unexpected.</p>
        <button onClick={signOut} className="btn-primary px-5 py-2 rounded-lg font-semibold">Sign out</button>
      </div>
      <p className="text-faint text-xs text-center mt-6">
        Developed by InnerGame Consulting
        {' · '}<a href="/privacy.html" className="hover:text-primary">Privacy</a>
        {' · '}<a href="/terms.html" className="hover:text-primary">Terms</a>
      </p>
    </div>
  );

  if (error) return (
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="surface rounded-2xl p-8 max-w-md text-center">
        <div className="mb-3 text-secondary flex justify-center"><Icon name="warning" size={32} /></div>
        <p className="font-semibold mb-2">Couldn't load coachee data.</p>
        <p className="text-faint text-sm">{error}</p>
      </div>
    </div>
  );

  if (!data) return (
    <div className="min-h-screen flex items-center justify-center">
      <p className="text-faint text-sm">Loading your dashboard…</p>
    </div>
  );

  return <AppShell data={data} signOut={signOut} updateProfileField={updateProfileField} updateData={updateData} coachees={coachees} coacheeId={coacheeId} activeFolder={activeFolder} setActiveFolder={setActiveFolder} authedEmail={authedEmail} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
