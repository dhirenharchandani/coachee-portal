        </div>
      </KpiField>
      <KpiField label="Unit" width={100}>
        <input value={f.unit} onChange={e => setF({ ...f, unit: e.target.value })} placeholder="count" className="input" />
      </KpiField>
      <KpiField label="Summarise as" width={120}>
        <select value={f.agg} onChange={e => setF({ ...f, agg: e.target.value })} className="input">
          <option value="sum">Total</option><option value="avg">Average</option><option value="latest">Latest</option>
        </select>
      </KpiField>
      <KpiField label="Tracking from" width={150}>
        <input type="date" value={f.start_date} onChange={e => setF({ ...f, start_date: e.target.value })} className="input" />
      </KpiField>
      <div className="flex gap-2 items-center ml-auto">
        {warn && <span className="text-xs" style={{ color: '#f43f5e' }}>{warn}</span>}
        <button onClick={submit} className="btn-primary px-4 py-2 rounded-lg text-sm font-semibold">{submitLabel}</button>
        <button onClick={onCancel} className="px-3 py-2 rounded-lg text-sm surface-2">Cancel</button>
        {onRemove && <button onClick={onRemove} className="px-3 py-2 rounded-lg text-sm" style={{ color: '#f43f5e' }}>Remove</button>}
      </div>
    </div>
  );
}

function KpiCell({ kpi, period, value, onSave, isCurrent }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState('');
  const has = value !== undefined && value !== null;
  const hit = meetsGoal(has ? value : null, kpi.goal_op, kpi.goal_value);

  const bg = !has ? 'transparent'
    : hit === null ? 'var(--surface-2)'
    : hit ? 'rgba(52,211,153,0.16)' : 'rgba(244,63,94,0.14)';
  const fg = !has ? 'var(--dim)' : hit === null ? 'var(--text)' : hit ? '#34d399' : '#f43f5e';
  const border = has && hit !== null
    ? (hit ? '1px solid rgba(52,211,153,0.4)' : '1px solid rgba(244,63,94,0.35)')
    : '1px solid var(--border)';

  const commit = () => { setEditing(false); if (draft !== String(has ? value : '')) onSave(draft); };

  return (
    <td className="p-0" style={{ width: KPI_COLS.period }}>
      {editing ? (
        <input autoFocus value={draft} onChange={e => setDraft(e.target.value)} onBlur={commit}
          onKeyDown={e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') setEditing(false); }}
          className="text-center text-sm"
          style={{ background: 'var(--surface)', color: 'var(--text)', border: '1px solid var(--primary)',
                   borderRadius: 6, padding: '9px 4px', outline: 'none', margin: '0 2px', width: 'calc(100% - 4px)' }} />
      ) : (
        <div onClick={() => { setDraft(has ? String(value) : ''); setEditing(true); }}
          title={has ? 'Click to edit' : 'Click to enter a value'}
          className="text-center text-sm cursor-pointer"
          style={{ background: bg, color: fg, border, borderRadius: 6, padding: '9px 4px',
                   margin: '0 2px', fontWeight: has ? 600 : 400, minHeight: 36,
                   boxShadow: isCurrent ? 'inset 0 0 0 1px var(--primary-soft)' : 'none' }}>
          {has ? fmtNum(value) : <span style={{ opacity: 0.35 }}>+</span>}
        </div>
      )}
    </td>
  );
}

function KpiRow({ kpi, periods, values, currentPeriod, onSetValue, onUpdate, onRemove }) {
  const [editing, setEditing] = useState(false);
  const { latest, agg, trend, hits, scored } = summarise(kpi, values);

  const initial = useMemo(() => ({
    name: kpi.name, category: kpi.category || '', owner_name: kpi.owner_name || '',
    goal_op: kpi.goal_op, goal_value: kpi.goal_value ?? '', unit: kpi.unit || '',
    agg: kpi.agg || 'avg', start_date: kpi.start_date || '',
  }), [kpi]);

  if (editing) return (
    <tr>
      <td colSpan={5 + periods.length} className="p-4" style={{ background: 'var(--surface-2)', borderRadius: 10 }}>
        <KpiForm initial={initial} submitLabel="Save"
          onSubmit={(patch) => { setEditing(false); onUpdate(kpi.id, patch); }}
          onCancel={() => setEditing(false)}
          onRemove={() => { if (confirm('Remove "' + kpi.name + '" from the scorecard?')) onRemove(kpi.id); }} />
      </td>
    </tr>
  );

  return (
    <tr>
      <td className="py-1 pr-3" style={{ width: KPI_COLS.name, position: 'sticky', left: 0, background: 'var(--surface)', zIndex: 2 }}>
        <div className="flex items-center gap-2">
          {kpi.owner_name && (
            <span className="text-[10px] font-bold rounded-full flex items-center justify-center flex-shrink-0"
              style={{ width: 22, height: 22, background: 'var(--primary-soft)', color: 'var(--primary)' }}>
              {kpi.owner_name.split(' ').map(w => w[0]).slice(0, 2).join('')}
            </span>
          )}
          <div className="min-w-0">
            <button onClick={() => setEditing(true)} title="Edit this KPI"
              className="text-sm text-left hover:underline truncate block" style={{ color: 'var(--text)' }}>
              {kpi.name}
            </button>
            <span className="text-[10px] text-faint">
              {AGG_LABEL[kpi.agg] || kpi.agg}{kpi.unit ? ' · ' + kpi.unit : ''}
            </span>
          </div>
        </div>
      </td>
      <td className="px-2 text-xs" style={{ width: KPI_COLS.goal, color: 'var(--dim)' }}>
        {kpi.goal_value === null || kpi.goal_value === undefined
          ? <button onClick={() => setEditing(true)} className="text-faint hover:underline">set goal</button>
          : <span className="whitespace-nowrap">{OP_GLYPH[kpi.goal_op]} {fmtNum(kpi.goal_value)}</span>}
      </td>
      <td className="px-2 text-xs text-right whitespace-nowrap" style={{ width: KPI_COLS.latest, color: 'var(--text)' }}>
        {latest === null ? <span className="text-faint">—</span> : (
          <span className="inline-flex items-center gap-1">
            <span style={{ fontWeight: 600 }}>{fmtNum(latest)}</span>
            {trend && <span style={{ color: trend.good ? '#34d399' : '#f43f5e', fontSize: 10 }}>{trend.up ? '▲' : '▼'}</span>}
          </span>
        )}
      </td>
      <td className="px-2 text-xs text-right whitespace-nowrap" style={{ width: KPI_COLS.total, color: 'var(--dim)' }}>
        {agg === null ? <span className="text-faint">—</span>
          : <span>{fmtNum(agg)} <span className="text-faint" style={{ fontSize: 9 }}>{AGG_LABEL[kpi.agg]}</span></span>}
      </td>
      <td className="px-2 text-xs text-right whitespace-nowrap pr-4" style={{ width: KPI_COLS.ontarget }}>
        {scored === 0 ? <span className="text-faint">—</span>
          : <span style={{ color: hits === scored ? '#34d399' : hits === 0 ? '#f43f5e' : 'var(--dim)' }}>{hits}/{scored}</span>}
      </td>
      {periods.map(p => (
        <KpiCell key={p} kpi={kpi} period={p} value={values[kpi.id + '|' + p]}
          isCurrent={p === currentPeriod} onSave={(raw) => onSetValue(kpi.id, p, raw)} />
      ))}
    </tr>
  );
}

function KpisView({ coacheeId, authedEmail }) {
  const { defs, values, busy, error, clearError, setValue, addKpi, updateKpi, removeKpi, setCadenceStart } =
    useKpis(coacheeId, authedEmail);
  const [cadence, setCadence] = useState('weekly');
  const [adding, setAdding] = useState(false);
  const [offset, setOffset] = useState(0);
  const [ahead, setAhead] = useState(1);

  const blankKpi = useMemo(() => ({
    name: '', category: '', owner_name: '', goal_op: '>=', goal_value: '',
    unit: '', agg: 'sum', start_date: '',
  }), [adding]);

  if (defs === null) return (
    <div className="fade-in">
      <p className="text-faint text-xs tracking-[0.2em] mb-2">SCORECARD</p>
      <h1 className="text-3xl font-bold mb-2">KPIs</h1>
      <p className="text-faint text-sm">Loading…</p>
    </div>
  );

  const cadenceMeta = CADENCES.find(c => c.id === cadence);
  const counts = {};
  CADENCES.forEach(c => { counts[c.id] = defs.filter(d => d.cadence === c.id).length; });
  const rows = defs.filter(d => d.cadence === cadence);

  const starts = rows.map(r => r.start_date).filter(Boolean).sort();
  const anchor = starts[0] || isoDay(new Date());
  const allPeriods = periodsFromAnchor(cadence, anchor, ahead);
  const onScreen = cadence === 'daily' ? 14 : 10;
  const size = Math.min(onScreen, allPeriods.length);
  const maxOffset = Math.max(0, allPeriods.length - size);
  const clamped = Math.min(offset, maxOffset);
  const startIdx = Math.max(0, allPeriods.length - size - clamped);
  const periods = allPeriods.slice(startIdx, startIdx + size);
  const currentPeriod = periodStart(cadence, new Date());

  const groups = [];
  rows.forEach(r => {
    const key = (r.category || 'GENERAL').toUpperCase();
    let g = groups.find(x => x.key === key);
    if (!g) { g = { key, items: [] }; groups.push(g); }
    g.items.push(r);
  });

  return (
    <div className="fade-in">
      <p className="text-faint text-xs tracking-[0.2em] mb-2">SCORECARD</p>
      <div className="flex items-start justify-between flex-wrap gap-3 mb-2">
        <h1 className="text-3xl font-bold">KPIs</h1>
        <button onClick={() => setAdding(a => !a)} className="btn-primary px-4 py-2 rounded-lg text-sm font-semibold">+ Add KPI</button>
      </div>
      <p className="text-dim mb-5 reading" style={{ fontSize: '15px' }}>
        Click any cell to enter a value. Click a KPI name to change its goal, unit or start date.
        {busy && <span className="text-faint"> · saving…</span>}
      </p>

      {error && (
        <div className="rounded-xl p-3 mb-4 flex items-center gap-3"
          style={{ background: 'rgba(244,63,94,0.12)', border: '1px solid rgba(244,63,94,0.35)' }}>
          <span className="text-sm" style={{ color: '#f43f5e' }}>{error}</span>
          <button onClick={clearError} className="ml-auto text-xs text-faint hover:underline">Dismiss</button>
        </div>
      )}

      <div className="flex gap-2 mb-4 flex-wrap">
        {CADENCES.map(c => (
          <button key={c.id} onClick={() => { setCadence(c.id); setOffset(0); setAdding(false); }}
            className="px-4 py-2 rounded-lg text-sm font-semibold"
            style={cadence === c.id ? { background: 'var(--primary-soft)', color: 'var(--primary)' } : { color: 'var(--dim)' }}>
            {c.label} ({counts[c.id] || 0})
          </button>
        ))}
      </div>

      {adding && (
        <div className="surface rounded-xl p-4 mb-4">
          <p className="text-xs tracking-widest text-faint mb-3">NEW {cadence.toUpperCase()} KPI</p>
          <KpiForm initial={blankKpi} cadence={cadence} submitLabel="Add"
            onSubmit={(fields) => { setAdding(false); addKpi(fields); }}
            onCancel={() => setAdding(false)} />
        </div>
      )}

      {rows.length > 0 && (
        <div className="surface rounded-xl p-3 mb-4 flex items-end gap-4 flex-wrap">
          <KpiField label={'Track ' + cadenceMeta.noun + ' from'} width={150}>
            <input type="date" value={anchor}
              onChange={e => { if (e.target.value) { setOffset(0); setCadenceStart(cadence, e.target.value); } }}
              className="input" title={'Applies to all ' + cadence + ' KPIs'} />
          </KpiField>
          <KpiField label={cadenceMeta.noun + ' ahead'} width={120}>
            <div className="flex items-center gap-1">
              <button onClick={() => setAhead(a => Math.max(0, a - 1))}
                className="px-2 py-1 rounded surface-2 text-sm" style={{ minWidth: 28 }}>−</button>
              <span className="text-sm text-center" style={{ minWidth: 24 }}>{ahead}</span>
              <button onClick={() => setAhead(a => Math.min(24, a + 1))}
                className="px-2 py-1 rounded surface-2 text-sm" style={{ minWidth: 28 }}>+</button>
            </div>
          </KpiField>
          <div className="flex items-center gap-2 ml-auto">
            <button onClick={() => setOffset(o => Math.min(maxOffset, o + size))} disabled={clamped >= maxOffset}
              className="px-3 py-1.5 rounded-lg text-sm surface-2"
              style={{ opacity: clamped >= maxOffset ? 0.4 : 1 }}>‹ Earlier</button>
            <button onClick={() => setOffset(o => Math.max(0, o - size))} disabled={clamped === 0}
              className="px-3 py-1.5 rounded-lg text-sm surface-2"
              style={{ opacity: clamped === 0 ? 0.4 : 1 }}>Later ›</button>
            <span className="text-faint text-xs ml-2">
              {allPeriods.length > size ? size + ' of ' + allPeriods.length : allPeriods.length}
              {' ' + cadenceMeta.noun}
            </span>
          </div>
        </div>
      )}

      {rows.length === 0 ? (
        <EmptyState icon="trending" title={'No ' + cadence + ' KPIs yet.'}
          body={'Add the numbers you want to hold yourself to. You can set a goal now or leave it blank and fill it in later.'} />
      ) : (
        <div className="surface rounded-2xl p-4" style={{ overflowX: 'auto' }}>
          <table style={{ borderCollapse: 'separate', borderSpacing: '0 6px', tableLayout: 'fixed',
                          width: KPI_COLS.name + KPI_COLS.goal + KPI_COLS.latest + KPI_COLS.total + KPI_COLS.ontarget + periods.length * KPI_COLS.period }}>
            <colgroup>
              <col style={{ width: KPI_COLS.name }} />
              <col style={{ width: KPI_COLS.goal }} />
              <col style={{ width: KPI_COLS.latest }} />
              <col style={{ width: KPI_COLS.total }} />
              <col style={{ width: KPI_COLS.ontarget }} />
              {periods.map(p => <col key={p} style={{ width: KPI_COLS.period }} />)}
            </colgroup>
            <thead>
              <tr className="text-xs text-faint">
                <th className="text-left pb-2" style={{ position: 'sticky', left: 0, background: 'var(--surface)', zIndex: 3 }}>KPI</th>
                <th className="text-left pb-2 px-2">Goal</th>
                <th className="text-right pb-2 px-2">Latest</th>
                <th className="text-right pb-2 px-2" title="Summarised per KPI: total, average or latest">Summary</th>
                <th className="text-right pb-2 px-2 pr-4" title="Periods on target, of all periods with a value and a goal">On target</th>
                {periods.map(p => {
                  const [a, b] = periodLabel(cadence, p);
                  const isNow = p === currentPeriod;
                  return (
                    <th key={p} className="pb-2 text-center font-normal"
                      style={{ width: KPI_COLS.period, color: isNow ? 'var(--primary)' : undefined }}>
                      <div style={{ lineHeight: 1.25 }}>{a}</div>
                      <div style={{ lineHeight: 1.25 }}>{b}</div>
                    </th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {groups.map(g => (
                <React.Fragment key={g.key}>
                  <tr>
                    <td colSpan={5 + periods.length} className="pt-3 pb-1">
                      <span className="text-[10px] tracking-[0.18em] text-faint">{g.key}</span>
                    </td>
                  </tr>
                  {g.items.map(k => (
                    <KpiRow key={k.id} kpi={k} periods={periods} values={values}
                      currentPeriod={currentPeriod}
                      onSetValue={setValue} onUpdate={updateKpi} onRemove={removeKpi} />
                  ))}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* =====================================================================
   VIEW: Session Prep
   One row per upcoming session in public.session_preps, created by
   prep-sync.mjs from the coach's calendar. Clients fill in the three
   answers; the coach reads them (RLS blocks coach edits).
   ===================================================================== */
const PREP_QUESTIONS = [
  { key: 'moved', label: "What's moved since we last spoke?", hint: 'Wins, progress, anything that shifted.' },
  { key: 'stuck', label: "What's stuck?", hint: "Where you're struggling, or the pattern that keeps showing up." },
  { key: 'want', label: 'What do you most want from this session?', hint: 'The one thing you want to walk out with.' },
];
const PREP_OPEN_MS = 2 * 60 * 60 * 1000; // a session stays "next" until 2h after it starts

function fmtSessionDate(ts) {
  return new Date(ts).toLocaleString(undefined, { weekday: 'long', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function usePreps(coacheeId) {
  const [preps, setPreps] = useState([]);
  const load = useCallback(async () => {
    if (!sb || !coacheeId) { setPreps([]); return; }
    const { data } = await sb.from('session_preps')
      .select('id, starts_at, title, moved, stuck, want, submitted_at')
      .eq('coachee_id', coacheeId).eq('kind', 'individual')  // Bloom team prep happens in Bloom
      .order('starts_at', { ascending: false }).limit(24);
    setPreps(data || []);
  }, [coacheeId]);
  useEffect(() => { load(); }, [load]);

  const next = useMemo(() => {
    const cutoff = Date.now() - PREP_OPEN_MS;
    return [...preps].reverse().find(p => new Date(p.starts_at).getTime() > cutoff) || null;
  }, [preps]);

  const save = async (id, answers) => {
    const { data, error } = await sb.from('session_preps')
      .update({ ...answers, submitted_at: new Date().toISOString() }).eq('id', id).select('id');
    if (error) return error.message;
    if (!data || data.length === 0) return 'Not saved — please refresh and try again.';
    track('prep_submit', { id });
    await load();
    return null;
  };
  return { preps, next, save };
}

function PrepCard({ prep, isCoach, onNav }) {
  const { next } = prep;
  if (!next) return null;
  const when = fmtSessionDate(next.starts_at);
  const done = !!next.submitted_at;
  const title = isCoach
    ? (done ? 'Prep is in for the next session' : 'No prep yet for the next session')
    : (done ? "You're prepared for our next session" : 'Prepare for our next session');
  const body = isCoach
    ? `${when}. ${done ? 'Read their answers before the call.' : 'Not prepped yet.'}`
    : `${when}. ${done ? 'You can still add to your answers.' : 'Three questions, about two minutes.'}`;
  return (
    <button onClick={() => onNav('/prep')} className="surface rounded-xl p-5 text-left w-full hover:opacity-90 transition-opacity flex items-start gap-4"
      style={{ borderLeft: `3px solid ${done ? 'var(--primary)' : 'var(--secondary)'}` }}>
      <div className={done ? 'text-primary' : 'text-secondary'}><Icon name={done ? 'check' : 'clipboard'} size={22} strokeWidth={1.5} /></div>
      <div className="flex-1">
        <h3 className="font-semibold mb-1">{title}</h3>
        <p className="text-faint text-sm reading" style={{ fontSize: '13px' }}>{body}</p>
      </div>
      <span className="text-primary text-sm font-medium whitespace-nowrap">{isCoach ? 'Read' : done ? 'Edit' : 'Start'} →</span>
    </button>
  );
}

function PrepAnswers({ p }) {
  return (
    <div className="space-y-4">
      {PREP_QUESTIONS.map(q => (
        <div key={q.key}>
          <p className="text-faint text-xs mb-1">{q.label}</p>
          <p className="reading whitespace-pre-wrap" style={{ fontSize: '15px' }}>{p[q.key] || <span className="text-faint">—</span>}</p>
        </div>
      ))}
    </div>
  );
}

function PrepView({ prep, isCoach }) {
  const { preps, next, save } = prep;
  const [answers, setAnswers] = useState({ moved: '', stuck: '', want: '' });
  const [status, setStatus] = useState(null); // null | 'saving' | 'saved' | error string
  useEffect(() => {
    setAnswers({ moved: next?.moved || '', stuck: next?.stuck || '', want: next?.want || '' });
    setStatus(null);
  }, [next?.id]);

  const canSubmit = PREP_QUESTIONS.some(q => answers[q.key].trim()) && status !== 'saving';
  const submit = async () => {
    setStatus('saving');
    const clean = Object.fromEntries(PREP_QUESTIONS.map(q => [q.key, answers[q.key].trim() || null]));
    const err = await save(next.id, clean);
    setStatus(err || 'saved');
  };
  const past = preps.filter(p => p.submitted_at && p.id !== next?.id);

  return (
    <div className="fade-in">
      <p className="text-faint text-xs tracking-[0.2em] mb-2">SESSION PREP</p>
      <h1 className="text-3xl font-bold mb-2">{next ? `Before ${fmtSessionDate(next.starts_at)}` : 'Session Prep'}</h1>
      <p className="text-dim mb-8 reading" style={{ fontSize: '15px' }}>
        {isCoach ? 'What they want to bring to the next session.' : 'Two minutes now makes the hour count. Dhiren reads this before you meet.'}
      </p>

      {!next && <EmptyState icon="clipboard" title="Nothing to prepare right now." body="When your next session is booked, three short questions will appear here ahead of it." />}

      {next && isCoach && (
        <div className="surface rounded-2xl p-5 md:p-6 mb-10">
          {next.submitted_at ? <PrepAnswers p={next} /> : <p className="text-faint text-sm">Not submitted yet.</p>}
        </div>
      )}

      {next && !isCoach && (
        <div className="surface rounded-2xl p-5 md:p-6 mb-10 space-y-6">
          {PREP_QUESTIONS.map(q => (
            <div key={q.key}>
              <label className="font-semibold block mb-1" htmlFor={`prep-${q.key}`}>{q.label}</label>
              <p className="text-faint text-sm mb-2">{q.hint}</p>
              <textarea id={`prep-${q.key}`} value={answers[q.key]} rows={3} maxLength={4000}
                onChange={e => { setAnswers({ ...answers, [q.key]: e.target.value }); if (status === 'saved') setStatus(null); }}
                className="w-full surface-2 rounded-lg p-3 resize-y outline-none reading"
                style={{ fontSize: '16px', lineHeight: 1.6, color: 'var(--text)' }} />
            </div>
          ))}
          <div className="flex items-center justify-end gap-3">
            {status === 'saved' && <span className="text-primary text-sm">Sent to Dhiren ✓</span>}
            {status && !['saving', 'saved'].includes(status) && <span className="text-sm" style={{ color: 'var(--secondary)' }}>{status}</span>}
            <button onClick={submit} disabled={!canSubmit} className="btn-primary px-5 py-2 rounded-lg text-sm font-semibold disabled:opacity-50">
              {status === 'saving' ? 'Saving…' : next.submitted_at ? 'Update' : 'Send to Dhiren'}
            </button>
          </div>
        </div>
      )}

      {past.length > 0 && (
        <>
          <SectionHeading sub={isCoach ? 'Their earlier prep notes.' : 'What you brought to earlier sessions.'}>Past prep</SectionHeading>
          <div className="space-y-4">
            {past.map(p => (
              <div key={p.id} className="surface rounded-2xl p-5 md:p-6">
                <p className="text-faint text-xs tracking-[0.18em] mb-4 uppercase">{fmtSessionDate(p.starts_at)}</p>
                <PrepAnswers p={p} />
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

/* =====================================================================
   VIEW: Engagement (coach only)
   Rows from public.coach_engagement(), which returns nothing for
   non-coach emails. "Last seen" is the later of the last sign-in and the
   last session refresh and the last tracked event, so clients who used the
   dashboard before tracking existed still show their history.
   ===================================================================== */
const DAY_MS = 24 * 60 * 60 * 1000;
const ENGAGEMENT_BUCKETS = [
  { id: 'active', label: 'Active · 7 days', color: 'var(--primary)' },
  { id: 'quiet', label: 'Quiet · 8–30 days', color: 'var(--secondary)' },
  { id: 'dormant', label: 'Dormant · 30+ days', color: 'var(--text-dim)' },
  { id: 'never', label: 'Never signed in', color: 'var(--text-faint)' },
];

function daysAgoLabel(ts) {
  if (!ts) return '—';
  const d = Math.floor((Date.now() - new Date(ts).getTime()) / DAY_MS);
  return d <= 0 ? 'today' : d === 1 ? 'yesterday' : `${d}d ago`;
}

// WhatsApp prep reminders go out from the coach's own WhatsApp via
// click-to-chat links: the message is prefilled, the coach taps Send.
// Keep this wording in sync with prepMessage() / teamPrepMessage() in prep-sync.mjs.
const PREP_LINK = 'https://dashboard.myinnergame.com/#/prep';
const BLOOM_LINK = 'https://static.bloomgrowth.com';
const REMIND_WINDOW_MS = 7 * DAY_MS; // matches the weekly prep-sync run

function sessionWhenPhrase(ts) {
  const d = new Date(ts);
  const dayKey = (x) => x.toDateString();
  const today = new Date();
  const tomorrow = new Date(today.getTime() + DAY_MS);
  if (dayKey(d) === dayKey(today)) return 'today';
  if (dayKey(d) === dayKey(tomorrow)) return 'tomorrow';
  return 'on ' + d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
}

function prepMessage(firstName, startsAt) {
  return `Hi ${firstName || 'there'}, looking forward to our session ${sessionWhenPhrase(startsAt)}. ` +
    "Before we meet, take two minutes with three questions: what's moved, what's stuck, and what you most want from our time.\n\n" + PREP_LINK;
}

function bloomMeetingLabel(title) {
  if (/quarterly/i.test(title || '')) return 'Bloom quarterly session';
  if (/bloom day/i.test(title || '')) return 'Bloom Day';
  return 'Bloom weekly meeting';
}

function teamPrepMessage(title, startsAt) {
  return `Team, your ${bloomMeetingLabel(title)} is ${sessionWhenPhrase(startsAt)}. ` +
    'Before you meet, log in to your Bloom dashboard and update your headlines, KPIs, QP’s, to-dos and O&Os, so you can spend your time on what matters.\n\n' + BLOOM_LINK;
}

// No phone = WhatsApp's own chat picker, used to post into a team's group chat.
// api.whatsapp.com rather than wa.me: some ISPs DNS-block wa.me.
function waLink(phone, text) {
  return phone
    ? `https://api.whatsapp.com/send?phone=${phone.replace(/\D/g, '')}&text=${encodeURIComponent(text)}`
    : `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
}

// "+971 50-123 4567" / "00971501234567" → "+971501234567"; null if it can't be a number.
function normalizePhone(raw) {
  let t = String(raw || '').trim().replace(/[\s().-]/g, '');
  if (t.startsWith('00')) t = '+' + t.slice(2);
  return /^\+[1-9]\d{6,14}$/.test(t) ? t : null;
}

function WhatsAppCell({ row, onSaved }) {
  const [editing, setEditing] = useState(false);
  const [value, setValue] = useState(row.whatsapp || '');
  const [err, setErr] = useState(null);
  const save = async () => {
    const raw = value.trim();
    const phone = raw ? normalizePhone(raw) : null;
    if (raw && !phone) { setErr('Use international format, e.g. +971501234567'); return; }
    const { error } = await sb.from('coachee_whatsapp')
      .upsert({ coachee_id: row.coachee_id, phone, updated_at: new Date().toISOString() });
    if (error) { setErr(error.message); return; }
    setErr(null); setEditing(false); onSaved(row.coachee_id, phone);
  };
  if (row.channel === 'group') return <span className="text-dim" title="Reminders go to this team's WhatsApp group">Group chat</span>;
  if (!editing) {
    return (
      <button onClick={(e) => { e.stopPropagation(); setValue(row.whatsapp || ''); setEditing(true); }}
        className={row.whatsapp ? 'hover:opacity-70' : 'text-primary hover:opacity-70'}>
        {row.whatsapp || '+ Add'}
      </button>
    );
  }
  return (
    <div onClick={(e) => e.stopPropagation()}>
      <input autoFocus value={value} onChange={e => setValue(e.target.value)} placeholder="+971…"
        onKeyDown={e => { if (e.key === 'Enter') save(); if (e.key === 'Escape') setEditing(false); }}
        className="surface-2 rounded px-2 py-1 text-sm outline-none" style={{ width: 150, color: 'var(--text)' }} />
      <button onClick={save} className="text-primary text-sm ml-2">Save</button>
      {err && <div className="text-xs mt-1" style={{ color: 'var(--secondary)' }}>{err}</div>}
    </div>
  );
}

function PrepReminders({ rows, onEditNumber }) {
  const [sessions, setSessions] = useState([]);
  useEffect(() => {
    if (!sb) return;
    const now = new Date();
    sb.from('session_preps').select('id, coachee_id, starts_at, title, kind, time_known')
      .is('submitted_at', null)
      .gt('starts_at', now.toISOString())
      .lte('starts_at', new Date(now.getTime() + REMIND_WINDOW_MS).toISOString())
      .order('starts_at')
      .then(({ data }) => setSessions(data || []));
  }, []);

  const byId = useMemo(() => new Map(rows.map(r => [r.coachee_id, r])), [rows]);
  const due = sessions.map(p => ({ p, r: byId.get(p.coachee_id) })).filter(x => x.r);
  if (!due.length) return null;
  return (
    <div className="mb-8">
      <SectionHeading sub="Sessions in the next 7 days without prep yet. Tap to open WhatsApp with the message written; for teams, pick their group. You press Send.">Prep reminders</SectionHeading>
      <div className="space-y-2">
        {due.map(({ p, r }) => {
          const team = p.kind === 'team';
          const when = p.time_known
            ? fmtSessionDate(p.starts_at)
            : new Date(p.starts_at).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' }) + ' · from weekly schedule';
          const text = team ? teamPrepMessage(p.title, p.starts_at) : prepMessage(r.preferred_name, p.starts_at);
          return (
            <div key={p.id} className="surface rounded-xl px-4 py-3 flex items-center gap-3 flex-wrap">
              <div className="flex-1 min-w-[180px]">
                <div className="font-semibold">{r.name || r.folder}{team && <span className="text-faint font-normal text-sm"> · team group</span>}</div>
                <div className="text-faint text-sm">{when}</div>
              </div>
              {team || r.whatsapp
                ? <a href={waLink(team ? null : r.whatsapp, text)} target="_blank" rel="noopener"
                    className="btn-primary px-4 py-2 rounded-lg text-sm font-semibold">Open in WhatsApp</a>
                : <button onClick={() => onEditNumber(r.coachee_id)} className="text-primary text-sm">Add WhatsApp number ↓</button>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function usePersonModel(coacheeId, enabled) {
  const [state, setState] = useState({ status: 'idle', findings: [], evidence: [], history: [], predictions: [], interventions: [], growthHistory: [], runs: [], settings: null, error: null });
  const mock = useRef(null);
  const load = useCallback(async () => {
    if (enabled && MOCK_COACH) {
      if (!mock.current) {
        const r = await fetch(`data/_preview/${MOCK_FOLDER}.pm.json?t=${Date.now()}`);
        mock.current = r.ok ? await r.json() : { findings: [], evidence: [], history: [], transcripts: {} };
        for (const k of ['predictions', 'interventions', 'growth_history', 'runs']) mock.current[k] = mock.current[k] || [];
        mock.current.settings = mock.current.settings || null;
        window.__pmMock = mock.current;
      }
      const m = mock.current;
      setState({ status: 'ready', findings: [...m.findings], evidence: [...m.evidence], history: [...m.history],
        predictions: [...m.predictions], interventions: [...m.interventions], growthHistory: [...m.growth_history], runs: [...m.runs], settings: m.settings, error: null });
      return;
    }
    if (!enabled || !sb || !coacheeId) return;
    setState(s => ({ ...s, status: s.findings.length ? 'refreshing' : 'loading' }));
    const { data: findings, error } = await sb.from('pm_findings').select('*').eq('coachee_id', coacheeId).order('code');
    if (error) { setState(s => ({ ...s, status: 'error', error: error.message })); return; }
    const ids = (findings || []).map(f => f.id);
    let evidence = [], history = [];
    if (ids.length) {
      const [ev, hi] = await Promise.all([
        sb.from('pm_evidence').select('*').in('finding_id', ids),
        sb.from('pm_finding_history').select('*').in('finding_id', ids).order('changed_at'),
      ]);
      if (ev.error || hi.error) { setState(s => ({ ...s, status: 'error', error: (ev.error || hi.error).message })); return; }
      evidence = ev.data || []; history = hi.data || [];
    }
    const [pr, iv, gh, ru, cs] = await Promise.all([
      sb.from('pm_predictions').select('*').eq('coachee_id', coacheeId).order('code'),
      sb.from('pm_interventions').select('*').eq('coachee_id', coacheeId).order('code'),
      sb.from('pm_growth_history').select('*').eq('coachee_id', coacheeId).order('changed_at'),
      sb.from('pm_runs').select('id, kind, sessions_read, created_at').eq('coachee_id', coacheeId).order('created_at'),
      sb.from('pm_client_settings').select('*').eq('coachee_id', coacheeId).maybeSingle(),
    ]);
    // Growth tables may not exist yet on an older database; the rest of the model still loads.
    setState({ status: 'ready', findings: findings || [], evidence, history,
      predictions: pr.data || [], interventions: iv.data || [], growthHistory: gh.data || [], runs: ru.data || [], settings: cs.data || null, error: null });
  }, [coacheeId, enabled]);
  useEffect(() => { load(); }, [load]);

  const update = async (id, patch, reason) => {
    if (MOCK_COACH) {
      const m = mock.current, f = m.findings.find(x => x.id === id);
      for (const [k, v] of Object.entries(patch)) {
        if (JSON.stringify(f[k]) !== JSON.stringify(v)) m.history.push({ id: m.history.length + 1000, finding_id: id, changed_at: new Date().toISOString(), actor: 'preview-coach@local', field: k, before: f[k], after: v, reason });
      }
      m.findings = m.findings.map(x => x.id === id ? { ...x, ...patch } : x);
      await load(); return true;
    }
    const { error } = await sb.from('pm_findings').update({ ...patch, last_change_reason: reason || null }).eq('id', id);
    if (error) throw new Error('Could not save: ' + error.message);
    await load();
    return true;
  };
  // Merge: the candidate's evidence moves to the surviving finding; the candidate is kept, marked merged.
  const merge = async (fromId, intoId, reason) => {
    const into = state.findings.find(f => f.id === intoId);
    const from = state.findings.find(f => f.id === fromId);
    if (MOCK_COACH) {
      mock.current.evidence = mock.current.evidence.map(e => e.finding_id === fromId ? { ...e, finding_id: intoId } : e);
      return update(fromId, { status: 'merged', merged_into: intoId }, reason || `Merged into ${into?.code}`);
    }
    const ev = await sb.from('pm_evidence').update({ finding_id: intoId }).eq('finding_id', fromId);
    if (ev.error) throw new Error('Could not move evidence: ' + ev.error.message);
    await sb.from('pm_findings').update({ last_change_reason: `Absorbed ${from?.code}: ${reason || 'merged in review'}`, episodes: (into?.episodes || 0) + (from?.episodes || 0) }).eq('id', intoId);
    return update(fromId, { status: 'merged', merged_into: intoId }, reason || `Merged into ${into?.code}`);
  };

  // Predictions and interventions. The database refuses what the framework forbids (accepting on an
  // unconfirmed finding, rewording a prediction after it was logged), so the message is shown as is.
  const updateGrowth = async (type, id, patch, reason) => {
    const table = type === 'prediction' ? 'pm_predictions' : 'pm_interventions';
    if (MOCK_COACH) {
      const m = mock.current, key = type === 'prediction' ? 'predictions' : 'interventions', it = m[key].find(x => x.id === id);
      for (const [k, v] of Object.entries(patch)) {
        if (JSON.stringify(it[k]) !== JSON.stringify(v)) m.growth_history.push({ id: m.growth_history.length + 5000, item_type: type, item_id: id, changed_at: new Date().toISOString(), actor: 'preview-coach@local', field: k, before: it[k], after: v, reason });
      }
      m[key] = m[key].map(x => x.id === id ? { ...x, ...patch, ...(patch.status === 'scored' ? { scored_at: new Date().toISOString() } : {}), ...(patch.shared_with_client ? { shared_at: new Date().toISOString() } : {}) } : x);
      await load(); return true;
    }
    const { error } = await sb.from(table).update({ ...patch, last_change_reason: reason || null }).eq('id', id);
    if (error) throw new Error('Could not save: ' + error.message.replace(/^pm_(predictions|interventions): /, ''));
    await load();
    return true;
  };

  // The per-client switch: whether the client's own login can open their read (pm_client_read checks it).
  const setClientVisible = async (visible) => {
    if (MOCK_COACH) { mock.current.settings = { ...(mock.current.settings || {}), visible, visible_changed_at: new Date().toISOString() }; await load(); return true; }
    const { error } = await sb.from('pm_client_settings').upsert({ coachee_id: coacheeId, visible }, { onConflict: 'coachee_id' });
    if (error) throw new Error('Could not save: ' + error.message);
    await load();
    return true;
  };

  // Deletes the whole read for this client (pm_coach_delete_read): findings, quotes, history, growth, runs.
  // Switches it off and clears consent. Session transcripts are kept.
  const deleteRead = async () => {
    if (MOCK_COACH) {
      const m = mock.current;
      for (const k of ['findings', 'evidence', 'history', 'predictions', 'interventions', 'growth_history', 'runs']) m[k] = [];
      m.settings = { visible: false, read_deleted_at: new Date().toISOString() };
      await load(); return true;
    }
    const { error } = await sb.rpc('pm_coach_delete_read', { coachee: coacheeId });
    if (error) throw new Error('Could not delete: ' + error.message);
    await load();
    return true;
  };

  const byFinding = useMemo(() => {
    const ev = {}, hi = {}, gh = {};
    state.evidence.forEach(e => { (ev[e.finding_id] = ev[e.finding_id] || []).push(e); });
    state.history.forEach(h => { (hi[h.finding_id] = hi[h.finding_id] || []).push(h); });
    state.growthHistory.forEach(h => { (gh[h.item_id] = gh[h.item_id] || []).push(h); });
    return { ev, hi, gh };
  }, [state.evidence, state.history, state.growthHistory]);

  return { ...state, evidenceFor: id => byFinding.ev[id] || [], historyFor: id => byFinding.hi[id] || [], growthHistoryFor: id => byFinding.gh[id] || [],
    update, merge, updateGrowth, setClientVisible, deleteRead, reload: load };
}

// Every save in the person model goes through this: it can't leave buttons stuck, it gives up after 20s
// with a clear message, and the caller shows the error in the panel instead of failing silently.
async function pmAttempt(fn, ms = 20000) {
  let t;
  try {
    const ok = await Promise.race([fn(), new Promise((_, rej) => { t = setTimeout(() => rej(new Error('No response from the server after 20 seconds. Reload the page and try again. If it keeps happening, sign out and back in.')), ms); })]);
    return { ok: ok !== false };
  } catch (e) {
    console.error('[person model]', e);
    return { ok: false, error: (e && e.message) || String(e) };
  } finally { clearTimeout(t); }
}

}

function pmSessionLabel(data, sessionId) {
  const s = (data.sessions || []).find(x => x.id === sessionId);
  // Sessions from before the dashboard (older transcripts) carry their date in the id.
  const date = s ? s.date : (/^\d{4}-\d{2}-\d{2}/.test(sessionId || '') ? sessionId.slice(0, 10) : null);
  if (!date) return sessionId;
  const d = new Date(date + 'T12:00:00');
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}

  );
}

function PmHeader({ eyebrow, title, sub, clientView, setClientView, isCoach }) {
  return (
    <div className="mb-8">
      <div className="flex items-start justify-between gap-4 flex-wrap">
        <div className="min-w-0">
          <p className="text-faint text-xs tracking-[0.2em] mb-2">{eyebrow}</p>
          <h1 className="text-3xl font-bold mb-2">{title}</h1>
          {sub && <p className="text-dim reading" style={{ fontSize: '15px' }}>{sub}</p>}
        </div>
        {isCoach && (
          <button onClick={() => setClientView(!clientView)}
            className={'px-3 py-1.5 rounded-lg text-sm inline-flex items-center gap-2 shrink-0 ' + (clientView ? 'btn-primary' : 'surface hover:bg-primary-soft')}>
            <Icon name={clientView ? 'users' : 'lock'} size={15} /> {clientView ? 'Showing as client' : 'Show as client'}
          </button>
        )}
      </div>
    </div>

}

// Shows a quote in the context of its transcript (coach-only table; the coach is driving the screen).
function PmTranscriptContext({ evidence }) {
  const [ctx, setCtx] = useState(null);
  useEffect(() => {
    let off = false;
    const fetchT = MOCK_COACH
      ? Promise.resolve({ data: { transcript_md: (window.__pmMock?.transcripts || {})[evidence.transcript_id] || '' } })
      : sb.from('session_transcripts').select('transcript_md').eq('id', evidence.transcript_id).maybeSingle();
    fetchT.then(({ data: r }) => {
      if (off || !r) return;
      const flat = r.transcript_md.replace(/\*/g, '').replace(/\s+/g, ' ');
      const i = flat.indexOf(evidence.quote);
      if (i < 0) { setCtx({ moved: true }); return; }
      setCtx({ before: flat.slice(Math.max(0, i - 420), i), after: flat.slice(i + evidence.quote.length, i + evidence.quote.length + 420), start: i > 420 });
    });
    return () => { off = true; };
  }, [evidence.id]);
  if (!ctx) return <p className="text-faint text-xs mt-2">Loading transcript…</p>;
  if (ctx.moved) return <p className="text-secondary text-xs mt-2">This quote no longer matches the stored transcript. The transcript was changed after the finding was saved.</p>;
  return (
    <p className="text-xs text-dim mt-2 reading" style={{ fontSize: '13px', lineHeight: 1.6 }}>
      {ctx.start && '… '}{ctx.before}<mark style={{ background: 'var(--primary-soft)', color: 'var(--text)', padding: '0 2px' }}>{evidence.quote}</mark>{ctx.after} …
    </p>
  );
}

function PmHistory({ items, clientView, findings }) {
  // The client's history starts when the coach confirmed it; drafting before that is review work, not change in them.
  const confirmedAt = items.find(h => h.field === 'status' && h.after === 'confirmed')?.changed_at;
  const shown = clientView
    ? items.filter(h => h.field === 'created' || (confirmedAt && h.changed_at >= confirmedAt && PM_HISTORY_CLIENT_FIELDS.includes(h.field)))
    : items;
  if (!shown.length) return <p className="text-faint text-sm">No changes recorded yet.</p>;
  const fmt = (v) => {
    if (v === null || v === undefined) return '—';
    if (typeof v === 'string') { const m = findings.find(f => f.id === v); return m ? m.code : v; }
    return Array.isArray(v) ? v.join(', ') : JSON.stringify(v);
  };
  return (
    <ol className="space-y-2">
      {shown.map(h => (
        <li key={h.id} className="text-sm flex gap-3">
          <span className="text-faint text-xs shrink-0 pt-0.5" style={{ minWidth: 86 }}>{pmDate(h.changed_at)}</span>
          <span className="text-dim">
            {h.field === 'created' ? 'First proposed'
              : clientView && PM_HISTORY_TEXT_FIELDS[h.field] ? <><strong className="text-[var(--text)]">{PM_HISTORY_TEXT_FIELDS[h.field]}</strong>: wording updated</>
              : <><strong className="text-[var(--text)]">{h.field.replace(/_/g, ' ')}</strong>: {fmt(h.before)} → {fmt(h.after)}</>}
            {h.reason && !clientView && <span className="text-faint"> · {h.reason}</span>}
            {!clientView && <span className="text-faint"> · {h.actor}</span>}
          </span>
        </li>
      ))}
    </ol>
  );
}

// Layout follows "The Read": one overview (three columns of section cards), and a reader that opens over it
// with a breadcrumb and previous / next, so the model is read like a document rather than a database.
const PM_COLUMNS = [
  { id: 'os', title: 'My OS', line: 'What drives you and how you operate', icon: 'map', color: '#60a5fa' },
  { id: 'insights', title: 'My Insights', line: 'What you may be learning about yourself', icon: 'sparkles', color: '#a78bfa' },
  { id: 'growth', title: 'My Growth', line: 'How you could change and grow', icon: 'trending', color: '#34d399' },
];
const PM_GROWTH_SECTIONS = [
  { id: 'prediction', title: 'Prediction', line: 'What I may do in an upcoming situation, under which conditions, and how sure that is' },
  { id: 'nudges', title: 'Nudges', line: 'Short, optional prompts to prepare, interrupt an unhelpful response or reinforce a helpful one' },
  { id: 'interventions', title: 'Optimisation / Interventions', line: 'Specific changes that fit how I operate, and how we will know they helped' },
  { id: 'evolution', title: 'My Evolution', line: 'Meaningful changes in my behaviour and results' },
];
const pmSort = (a, b) => PM_RANK[a.importance] - PM_RANK[b.importance] || PM_CONF_RANK[a.confidence] - PM_CONF_RANK[b.confidence] || a.code.localeCompare(b.code);
const pmHeadline = (f) => f.confidence === 'thin' ? (f.client_question || f.client_headline) : f.client_headline;

// Pages the reader can step through, in overview order. Empty sections get a page of their own,
// so "nothing here" is stated rather than hidden.
// Each finding is shown in exactly one place, so the overview never repeats itself.
// Type decides first (the My Insights kinds, then strengths and challenges); otherwise the owning
// domain, which the pass lists first, picks the My OS section.
function pmPlace(f) {
  if (f.type === 'self_perception_gap') return 'insights/gaps';
  if (f.type === 'loop' && f.works_against_aims) return 'insights/loops';
  if ((f.type === 'connection' || f.type === 'conflict') && f.domains.length >= 2) return 'insights/connections';
  if (f.type === 'impact_on_others') return 'insights/impact';
  if (f.type === 'strength' && f.client_undervalues) return 'insights/unrecognised';
  if (f.type === 'strength' || f.type === 'vulnerability') return 'os/strengths';
  const d = f.domains[0];
  if (d === 'relationships') return 'os/relationships';
  if (['cognition', 'emotion', 'agency'].includes(d)) return 'os/think';
  return 'os/drives';
}
const pmIn = (col, sec) => f => pmPlace(f) === `${col.id}/${sec.id}`;

function pmPages(findings, growth) {
  const pages = [];
  for (const col of PM_COLUMNS) {
    const secs = col.id === 'growth' ? PM_GROWTH_SECTIONS : PM_SECTIONS[col.id];
    for (const sec of secs) {
      if (col.id === 'growth') {
        if (sec.id === 'evolution') { pages.push({ key: 'growth/evolution', col, sec, evolution: growth.evolution }); continue; }
        const items = growth[sec.id];
        if (!items.length) pages.push({ key: `${col.id}/${sec.id}`, col, sec, f: null });
        items.forEach((g, i) => pages.push({ key: `${col.id}/${sec.id}/${g.id}`, col, sec, g, gType: sec.id === 'prediction' ? 'prediction' : 'intervention', n: i + 1, of: items.length }));
        continue;
      }
      const items = findings.filter(pmIn(col, sec)).sort(pmSort);
      if (!items.length) pages.push({ key: `${col.id}/${sec.id}`, col, sec, f: null });
      items.forEach((f, i) => pages.push({ key: `${col.id}/${sec.id}/${f.id}`, col, sec, f, n: i + 1, of: items.length }));
    }
  }
  return pages;
}

// ── Growth: predictions, nudges, interventions, My Evolution ──
// Proposals wait in the Review Queue. Accepted items show in the Growth column. The client view shows an
// intervention once it is active and its finding is confirmed, and a prediction only once the coach has
// shared it (a prediction shared before the event can change the event).
const PM_KIND = { nudge: 'Nudge', practice: 'Practice', experiment: 'Experiment' };
const PM_OUTCOME = { hit: 'Happened as expected', miss: 'Did not happen as expected', partial: 'Partly as expected', not_testable: 'Could not tell' };
const PM_OUTCOME_COLOR = { hit: '#34d399', miss: '#f87171', partial: '#fbbf24', not_testable: 'var(--text-faint)' };
const PM_CONF_WORDS = { thin: 'a question to test', live: 'reasonably sure', solid: 'sure' };
const pmLive = f => f && PM_CLIENT_VISIBLE.includes(f.status);
const pmFindingsOf = (pm, p) => (p.finding_ids || []).map(id => pm.findings.find(f => f.id === id)).filter(Boolean);
const pmShortDate = (d) => new Date(d + (d.length === 10 ? 'T12:00:00' : '')).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });

function pmGrowth(pm, clientView) {
  const preds = pm.predictions.filter(p => ['open', 'scored'].includes(p.status)
    && (!clientView || (p.shared_with_client && pmFindingsOf(pm, p).every(pmLive))))
    .sort((a, b) => (a.status === 'open' ? 0 : 1) - (b.status === 'open' ? 0 : 1) || a.situation_date.localeCompare(b.situation_date));
  const ints = pm.interventions.filter(i => ['active', 'done'].includes(i.status) && pmLive(pm.findings.find(f => f.id === i.finding_id)))
    .sort((a, b) => (a.status === 'active' ? 0 : 1) - (b.status === 'active' ? 0 : 1) || a.code.localeCompare(b.code));
  return { prediction: preds, nudges: ints.filter(i => i.kind === 'nudge'), interventions: ints.filter(i => i.kind !== 'nudge'), evolution: pmEvolution(pm) };
}

// My Evolution: changes to confirmed findings after they were confirmed, newest first.
function pmEvolution(pm) {
  const out = [];
  for (const f of pm.findings.filter(f => pmLive(f) || f.status === 'closed')) {
    const hist = pm.historyFor(f.id);
    const confirmedAt = hist.find(h => h.field === 'status' && h.after === 'confirmed')?.changed_at;
    if (!confirmedAt) continue;
    for (const h of hist) {
      if (h.changed_at <= confirmedAt) continue;
      let text = null;
      if (h.field === 'confidence') text = `How sure: ${PM_CONF_WORDS[h.before] || h.before} → ${PM_CONF_WORDS[h.after] || h.after}`;
      else if (h.field === 'scope') text = 'Where it applies was updated';
      else if (h.field === 'exceptions') text = 'A new exception was added';
      else if (h.field === 'status' && h.after === 'closed') text = 'You have changed this. It no longer describes how you operate.';
      if (text) out.push({ id: h.id, at: h.changed_at, f, text });
    }
  }
  return out.sort((a, b) => b.at.localeCompare(a.at));
}

function PmGrowthTitle({ g, type, clientView, color, eyebrow }) {
  return (
    <div className="mb-8">
      <PmEyebrow color={color}>{eyebrow}</PmEyebrow>
      <div className="flex items-center gap-2 flex-wrap mb-3">
        {type === 'prediction'
          ? (g.status === 'scored' ? <PmChip color={PM_OUTCOME_COLOR[g.outcome]}>{PM_OUTCOME[g.outcome]}</PmChip> : <PmChip color="#60a5fa">For {pmShortDate(g.situation_date)}</PmChip>)
          : <><PmChip color="#34d399">{PM_KIND[g.kind]}</PmChip>{g.status === 'done' && <PmChip>Done</PmChip>}</>}
        {!clientView && <>
          <span className="text-faint text-xs font-mono">{g.code}</span>
          {!['open', 'active', 'scored', 'done'].includes(g.status) && <PmChip color="var(--secondary)">{g.status}</PmChip>}
          {type === 'prediction' && <PmChip color={g.shared_with_client ? '#a78bfa' : 'var(--text-faint)'} title="A prediction shared before the event can change it">{g.shared_with_client ? 'Shared with client' : 'Not shared'}</PmChip>}
        </>}
      </div>
      <h2 className="text-2xl font-bold leading-snug">{type === 'prediction' ? g.situation : g.opportunity}</h2>
    </div>
  );
}

function PmBasedOn({ findings, clientView }) {
  if (!findings.length) return null;
  return (
    <PmBlock title="Based on">
      <ul className="space-y-1">
        {findings.map(f => <li key={f.id}>{!clientView && <span className="text-faint text-xs font-mono mr-2">{f.code}</span>}{pmHeadline(f)}{!clientView && !pmLive(f) && <span className="text-faint"> ({f.status})</span>}</li>)}
      </ul>
    </PmBlock>
  );
}

function PmGrowthHistory({ items }) {
  if (!items.length) return null;
  return (
    <section className="mb-7">
      <PmEyebrow>History</PmEyebrow>
      <ol className="space-y-1.5">
        {items.map(h => (
          <li key={h.id} className="text-sm flex gap-3">
            <span className="text-faint text-xs shrink-0 pt-0.5" style={{ minWidth: 86 }}>{pmDate(h.changed_at)}</span>
            <span className="text-dim">{h.field === 'created' ? 'Proposed' : <><strong className="text-[var(--text)]">{h.field.replace(/_/g, ' ')}</strong>: {String(h.before ?? '—')} → {String(h.after ?? '—')}</>}
              {h.reason && <span className="text-faint"> · {h.reason}</span>}<span className="text-faint"> · {h.actor}</span></span>
          </li>
        ))}
      </ol>
    </section>
  );
}

function PmPredictionBody({ p, pm, clientView }) {
  return (
    <>
      <PmBlock title="When"><p>By {pmDate(p.situation_date + 'T12:00:00')}. Written down on {pmDate(p.created_at)}, before it happened.</p></PmBlock>
      <PmBlock title="What we expect"><p>{p.expected}</p></PmBlock>
      <PmBlock title="What would make it more or less likely"><p>{p.conditions}</p></PmBlock>
      <PmBlock title="What would show it was wrong"><p>{p.wrong_if}</p></PmBlock>
      {p.involves_others && <PmBlock title="How sure"><p>Less sure than usual: part of it depends on how someone else responds, and the model is only about you.</p></PmBlock>}
      <PmBasedOn findings={pmFindingsOf(pm, p)} clientView={clientView} />
      <PmBlock title="What happened">
        {p.status === 'scored'
          ? <><p><strong className="text-[var(--text)]">{PM_OUTCOME[p.outcome]}.</strong> {p.outcome_note}</p>
              {!clientView && p.shared_with_client && <p className="text-faint text-sm mt-2">Shared with the client before the event, so a hit is not counted as unassisted.</p>}
              {!clientView && p.outcome === 'miss' && <p className="text-faint text-sm mt-2">A miss should lower the finding's confidence or add an exception to its scope. Update the finding it rests on.</p>}</>
          : <p>Not known yet.</p>}
      </PmBlock>
      {!clientView && <PmGrowthHistory items={pm.growthHistoryFor(p.id)} />}
    </>
  );
}

function PmInterventionBody({ i, pm, clientView }) {
  const f = pm.findings.find(x => x.id === i.finding_id);
  return (
    <>
      <PmBlock title="When"><p>{i.point_of_change}</p></PmBlock>
      <PmBlock title="What to do"><p>{i.action}</p></PmBlock>
      <PmBlock title="What should improve"><p>{i.intended_benefit}</p></PmBlock>
      <PmBlock title="How we'll know it helped"><p>{i.how_we_know}</p></PmBlock>
      <PmBasedOn findings={f ? [f] : []} clientView={clientView} />
      <PmBlock title="What happened"><p>{i.result || (i.status === 'active' ? 'Under way. Nothing recorded yet.' : 'Not started.')}</p></PmBlock>
      {!clientView && <PmGrowthHistory items={pm.growthHistoryFor(i.id)} />}
    </>
  );
}

function PmEvolutionBody({ entries, clientView }) {
  return (
    <>
      <PmBlock title="What this shows"><p>Meaningful changes in your behaviour and results, newest first. One good week is an exception; a change is counted when the old pattern stops showing up across several occasions.</p></PmBlock>
      <section className="mb-7">
        <PmEyebrow>Changes</PmEyebrow>
        {entries.length === 0
          ? <p className="reading text-dim" style={{ fontSize: '16px' }}>{clientView ? 'Nothing yet. This fills in as what we have found together changes over time.' : 'No change to a confirmed finding since it was confirmed.'}</p>
          : <ol className="space-y-3">
              {entries.map(e => (
                <li key={e.id} className="flex gap-3">
                  <span className="text-faint text-xs shrink-0 pt-1" style={{ minWidth: 86 }}>{pmDate(e.at)}</span>
                  <div><p className="text-[var(--text)]">{pmHeadline(e.f)}</p><p className="text-dim text-sm">{e.text}</p></div>
                </li>
              ))}
            </ol>}
      </section>
    </>
  );
}

// Coach actions on accepted items, shown in the reader footer (never in client view).
function PmGrowthActions({ g, type, pm, data }) {
  const [mode, setMode] = useState(null);
  const [outcome, setOutcome] = useState('');
  const [note, setNote] = useState('');
  const [sessionId, setSessionId] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const run = async (fn) => { setBusy(true); setErr(''); const r = await pmAttempt(fn); setBusy(false); if (r.ok) { setMode(null); setNote(''); } else setErr(r.error); };
  const sessions = (data.sessions || []).filter(s => s.date >= (g.created_at || '').slice(0, 10)).slice(-8);
  if (type === 'prediction') {
    if (g.status !== 'open') return <p className="text-faint text-xs">Scored{g.scored_at ? ` on ${pmDate(g.scored_at)}` : ''}. A scored prediction stays as it is.</p>;
    return (
      <div>
        {mode === 'score' && (
          <div className="mb-3 space-y-2">
            <div className="flex gap-2 flex-wrap">
              {Object.entries(PM_OUTCOME).map(([k, v]) => <button key={k} onClick={() => setOutcome(k)} className={'px-3 py-1.5 rounded-lg text-sm ' + (outcome === k ? 'btn-primary' : 'surface')}>{v}</button>)}
            </div>
            <textarea className="input" rows={2} placeholder="What happened, in a sentence" value={note} onChange={e => setNote(e.target.value)} />
            <select className="input" value={sessionId} onChange={e => setSessionId(e.target.value)}>
              <option value="">Session where it came up (optional)</option>
              {sessions.map(s => <option key={s.id} value={s.id}>{s.displayDate || s.date} · {s.shortTitle || s.title}</option>)}
            </select>
            <button disabled={busy || !outcome || !note.trim()} onClick={() => run(() => pm.updateGrowth('prediction', g.id, { status: 'scored', outcome, outcome_note: note.trim(), outcome_session_id: sessionId || null }, 'Scored by coach'))}
              className="btn-primary px-4 py-1.5 rounded-lg text-sm font-semibold" style={{ opacity: outcome && note.trim() ? 1 : 0.5 }}>Save score</button>
          </div>
        )}
        <div className="flex flex-wrap gap-2 items-center">
          <button disabled={busy} onClick={() => setMode(mode === 'score' ? null : 'score')} className={'px-3 py-1.5 rounded-lg text-sm ' + (mode === 'score' ? 'btn-primary' : 'surface')}>Score it</button>
          {!g.shared_with_client && <button disabled={busy} onClick={() => run(() => pm.updateGrowth('prediction', g.id, { shared_with_client: true }, 'Shared with the client'))} className="surface px-3 py-1.5 rounded-lg text-sm">Mark as shared with client</button>}
          <PmSaveState busy={busy} err={err} />
          <span className="text-faint text-xs ml-auto hidden md:inline">{g.shared_with_client ? 'Shared: the client sees it' : 'Not shared: the client does not see it'}</span>
        </div>
      </div>
    );
  }
  if (!['active'].includes(g.status)) return <p className="text-faint text-xs">{g.status === 'done' ? 'Done.' : g.status}</p>;
  return (
    <div>
      {mode && (
        <div className="mb-3 flex gap-2 flex-wrap">
          <textarea autoFocus className="input flex-1" rows={2} style={{ minWidth: 220 }} placeholder={mode === 'done' ? 'What happened, and did it help?' : 'Why drop it?'} value={note} onChange={e => setNote(e.target.value)} />
          <button disabled={busy || !note.trim()} onClick={() => run(() => pm.updateGrowth('intervention', g.id, mode === 'done' ? { status: 'done', result: note.trim() } : { status: 'dropped', result: note.trim() }, mode === 'done' ? 'Result recorded by coach' : 'Dropped by coach'))}
            className="btn-primary px-4 py-2 rounded-lg text-sm font-semibold" style={{ opacity: note.trim() ? 1 : 0.5 }}>{mode === 'done' ? 'Save and mark done' : 'Drop'}</button>
        </div>
      )}
      <div className="flex flex-wrap gap-2 items-center">
        <button disabled={busy} onClick={() => setMode(mode === 'done' ? null : 'done')} className={'px-3 py-1.5 rounded-lg text-sm ' + (mode === 'done' ? 'btn-primary' : 'surface')}>Record result</button>
        <button disabled={busy} onClick={() => setMode(mode === 'drop' ? null : 'drop')} className="surface px-3 py-1.5 rounded-lg text-sm" style={{ color: '#f87171' }}>Drop</button>
        <PmSaveState busy={busy} err={err} />
        <span className="text-faint text-xs ml-auto hidden md:inline">Active: the client sees it</span>
      </div>
    </div>
  );
}

// One Growth section on the overview: predictions, nudges, interventions, or My Evolution.
// "N to review": goes straight to this section's items in the Review Queue, first one open.
// A chip sits inside a card that is itself a button, so the click must not also open the card.
function PmReviewLink({ n, to, onNav, chip }) {
  const go = (e) => { e.stopPropagation(); onNav(to); };
  if (chip) return <span role="link" tabIndex={0} onClick={go} onKeyDown={e => e.key === 'Enter' && go(e)} className="cursor-pointer hover:underline shrink-0 whitespace-nowrap"><PmChip color="#d97706">{n} to review →</PmChip></span>;
  return <button onClick={go} className="text-[11px] mt-2 hover:underline" style={{ color: '#d97706' }}>+ {n} waiting for review →</button>;
}

function PmGrowthCard({ sec, col, items, waiting, clientView, open, onNav }) {
  const isEvo = sec.id === 'evolution';
  if (!items.length) return (
    <button onClick={() => open(isEvo ? 'growth/evolution' : `growth/${sec.id}`)} className="text-left rounded-xl p-3.5 hover:bg-primary-soft transition" style={{ background: 'var(--surface-2)', border: '1px solid var(--border)', borderLeft: '3px solid var(--border)' }}>
      <p className="font-semibold text-sm">{sec.title}</p>
      <p className="text-faint text-xs mt-1 leading-relaxed">{sec.line}</p>
      <div className="flex gap-2 mt-2 flex-wrap">
        <PmChip>Not yet</PmChip>
        {waiting > 0 && <PmReviewLink n={waiting} to={`/model/review/growth/${sec.id}`} onNav={onNav} chip />}
      </div>
    </button>
  );
  return (
    <div className="rounded-xl p-3.5" style={{ background: 'var(--surface-2)', border: '1px solid var(--border)', borderLeft: `3px solid ${col.color}` }}>
      <p className="font-semibold text-sm mb-2">{sec.title}</p>
      <div className="space-y-1.5">
        {isEvo
          ? <button onClick={() => open('growth/evolution')} className="w-full text-left rounded-lg px-2.5 py-2 hover:bg-primary-soft transition" style={{ border: '1px solid var(--border)' }}>
              {items.slice(0, 3).map(e => <p key={e.id} className="text-sm leading-snug mb-1"><span className="text-faint text-xs mr-2">{pmDate(e.at)}</span>{e.text}</p>)}
              {items.length > 3 && <p className="text-faint text-xs">+ {items.length - 3} more</p>}
            </button>
          : items.map(g => (
            <button key={g.id} onClick={() => open(`growth/${sec.id}/${g.id}`)} className="w-full text-left rounded-lg px-2.5 py-2 hover:bg-primary-soft transition" style={{ border: '1px solid var(--border)' }}>
              <p className="text-sm leading-snug">{sec.id === 'prediction' ? g.situation : g.opportunity}</p>
              <div className="flex gap-1.5 mt-1.5 flex-wrap items-center">
                {sec.id === 'prediction'
                  ? (g.status === 'scored' ? <PmChip color={PM_OUTCOME_COLOR[g.outcome]}>{PM_OUTCOME[g.outcome]}</PmChip> : <PmChip color="#60a5fa">For {pmShortDate(g.situation_date)}</PmChip>)
                  : <PmChip color="#34d399">{PM_KIND[g.kind]}{g.status === 'done' ? ' · done' : ''}</PmChip>}
                {!clientView && <span className="text-faint text-[10px] font-mono">{g.code}</span>}
                {!clientView && sec.id === 'prediction' && !g.shared_with_client && <PmChip>Not shared</PmChip>}
              </div>
            </button>
          ))}
      </div>
      {waiting > 0 && <PmReviewLink n={waiting} to={`/model/review/growth/${sec.id}`} onNav={onNav} />}
    </div>
  );
}

// Review of proposals. Accept is offered only when the database would allow it.
function PmGrowthReviewActions({ g, type, pm, onDone }) {
  const [rejecting, setRejecting] = useState(false);
  const [reason, setReason] = useState('');
  const [busy, setBusy] = useState(false);
  const fs = type === 'prediction' ? pmFindingsOf(pm, g) : [pm.findings.find(f => f.id === g.finding_id)].filter(Boolean);
  const blockers = fs.filter(f => f.status !== 'confirmed' || (type === 'prediction' && !['live', 'solid'].includes(f.confidence)));
  const [err, setErr] = useState('');
  const run = async (fn) => { setBusy(true); setErr(''); const r = await pmAttempt(fn); setBusy(false); if (r.ok) onDone(); else setErr(r.error); };
  return (
    <div>
      {rejecting && (
        <div className="mb-3 flex gap-2 flex-wrap">
          <input autoFocus className="input flex-1" style={{ minWidth: 220 }} placeholder="Why? (kept with the record)" value={reason} onChange={e => setReason(e.target.value)} />
          <button disabled={busy || !reason.trim()} onClick={() => run(() => pm.updateGrowth(type, g.id, { status: 'rejected', reject_reason: reason.trim() }, reason.trim()))}
            className="px-4 py-2 rounded-lg text-sm font-semibold" style={{ background: '#f87171', color: 'white', opacity: reason.trim() ? 1 : 0.5 }}>Reject</button>
        </div>
      )}
      <div className="flex flex-wrap gap-2 items-center">
        <button disabled={busy || blockers.length > 0} onClick={() => run(() => pm.updateGrowth(type, g.id, { status: type === 'prediction' ? 'open' : 'active' }, 'Accepted by coach'))}
          className="btn-primary px-4 py-1.5 rounded-lg text-sm font-semibold" style={{ opacity: blockers.length ? 0.45 : 1 }}>Accept</button>
        <button disabled={busy} onClick={() => setRejecting(!rejecting)} className="surface px-3 py-1.5 rounded-lg text-sm" style={{ color: '#f87171' }}>Reject</button>
        <PmSaveState busy={busy} err={err} />
        <span className="text-faint text-xs ml-auto">
          {blockers.length
            ? `Confirm ${blockers.map(f => f.code).join(', ')} first${type === 'prediction' && blockers.some(f => !['live', 'solid'].includes(f.confidence)) ? ' (predictions need Live or Solid)' : ''}`
            : type === 'prediction' ? 'Accepting logs it. Its wording is then fixed; share it separately.' : 'Accepting shows it to the client.'}
        </span>
      </div>
    </div>
  );
}

function PmEyebrow({ children, color }) {

function PmBlock({ title, children }) {

function PmCoachChips({ f }) {

    <span className="text-faint text-xs font-mono">{f.code}</span>

// "How sure", spelled out from what the record stores (confidence, episodes, scope).
function pmHowSure(f) {
  const n = f.episodes || 0;
  const seen = n <= 1 ? 'one occasion so far' : n === 2 ? 'two separate occasions' : `${n} separate occasions`;
  return [
    ['That it happens', `seen on ${seen}.`],
    ['That it recurs', f.confidence === 'solid' ? 'sure: seen in more than one setting, with known exceptions.'
      : f.confidence === 'live' ? 'reasonably sure, though another explanation still stands.'
      : 'low. Treat this as a question to test, not a conclusion.'],
    ['Where it applies', f.scope ? 'described above.' : 'not yet narrowed.'],
    ['Why it happens', 'a working explanation, not yet tested.'],
  ];
}

function PmQuote({ e, data, clientView }) {
  const [open, setOpen] = useState(false);
  return (
    <div className="mb-5 pl-4" style={{ borderLeft: `2px solid ${e.is_counter ? 'var(--border)' : 'var(--secondary)'}` }}>
      <p className="reading italic" style={{ fontSize: '16px', lineHeight: 1.6, color: 'var(--text)' }}>"{e.quote}"</p>
      <div className="flex items-center gap-2 flex-wrap mt-2">
        <span className="text-faint text-xs">{pmSessionLabel(data, e.session_id)}</span>
        <PmChip>{PM_CLASS[e.class] || e.class}</PmChip>

}

function PmFindingBody({ f, pm, data, clientView }) {
  const ev = pm.evidenceFor(f.id);
  const support = ev.filter(e => !e.is_counter).sort((a, b) => a.session_id.localeCompare(b.session_id));
  const counter = ev.filter(e => e.is_counter);
  const sessions = new Set(support.map(e => e.session_id)).size;
  const seq = Array.isArray(f.pattern_sequence) ? f.pattern_sequence : [];
  const result = seq.find(s => s.step === 'consequence');
  return (
    <>
      <PmBlock title="What happens">
        <p>{f.statement}</p>
        {seq.length > 0 && (
          <ol className="mt-4 space-y-2" style={{ fontFamily: 'inherit' }}>
            {seq.map((s, i) => (
              <li key={i} className="flex gap-3 text-[15px]">
                <span className="text-faint shrink-0" style={{ minWidth: 118 }}>{i + 1}. {PM_STEP[s.step] || s.step}</span>
                <span className="flex-1">{s.text}</span>
                {!clientView && <span className="text-[10px] uppercase tracking-wider shrink-0 pt-1" style={{ color: s.basis === 'observed' ? '#34d399' : s.basis === 'inferred' ? '#fbbf24' : 'var(--text-faint)' }}>{s.basis}</span>}
              </li>
            ))}
          </ol>
        )}
      </PmBlock>

      <section className="mb-7">
        <PmEyebrow>When it happened</PmEyebrow>
        <p className="reading text-dim mb-3" style={{ fontSize: '16px' }}>
          Seen in {f.episodes || 0} separate situation{f.episodes === 1 ? '' : 's'}, across {sessions} session{sessions === 1 ? '' : 's'}. In your own words:
        </p>
        {support.map(e => <PmQuote key={e.id} e={e} data={data} clientView={clientView} />)}
      </section>

      <PmBlock title="What explains it">
        <p>{f.mechanism || 'Not yet worked out.'}</p>
        {f.alternative && <p className="mt-3"><span className="text-[var(--text)]">Another explanation: </span>{f.alternative}</p>}
      </PmBlock>

      <section className="mb-7">
        <PmEyebrow>When it does not apply</PmEyebrow>
        <div className="reading text-dim" style={{ fontSize: '16px' }}>
          {f.scope && <p><span className="text-[var(--text)]">Where it applies: </span>{f.scope}</p>}
          <p className="mt-2"><span className="text-[var(--text)]">Exceptions: </span>{f.exceptions || 'None known yet. A pattern with no known exceptions has usually not been tested.'}</p>
          <p className="mt-2"><span className="text-[var(--text)]">Where it did not hold: </span>{f.counter_evidence}</p>
        </div>
        {counter.length > 0 && <div className="mt-3">{counter.map(e => <PmQuote key={e.id} e={e} data={data} clientView={clientView} />)}</div>}
      </section>

      {result && <PmBlock title="What resulted"><p>{result.text}</p></PmBlock>}

      <section className="mb-7">
        <PmEyebrow>How sure</PmEyebrow>
        <ul className="reading text-dim space-y-1" style={{ fontSize: '16px' }}>
          {pmHowSure(f).map(([k, v]) => <li key={k}><span className="text-[var(--text)]">{k}: </span>{v}</li>)}
        </ul>
      </section>

      <section className="mb-7">
        <PmEyebrow>What changed over time</PmEyebrow>
        <PmHistory items={pm.historyFor(f.id)} clientView={clientView} findings={pm.findings} />
      </section>

      <PmBlock title="What could help">
        {(() => {
          const ints = pm.interventions.filter(i => i.finding_id === f.id && (clientView ? ['active', 'done'].includes(i.status) : i.status !== 'rejected'));
          const preds = clientView ? [] : pm.predictions.filter(p => (p.finding_ids || []).includes(f.id) && p.status !== 'rejected');
          if (!ints.length && !preds.length) return <p>Nothing is linked to this yet. Practices and experiments are chosen together in session.</p>;
          return <ul className="space-y-2">
            {ints.map(i => <li key={i.id}><span className="text-[var(--text)]">{PM_KIND[i.kind]}: </span>{i.action}{!clientView && <span className="text-faint text-sm"> ({i.code}, {i.status})</span>}</li>)}
            {preds.map(p => <li key={p.id}><span className="text-[var(--text)]">Prediction: </span>{p.situation}<span className="text-faint text-sm"> ({p.code}, {p.status})</span></li>)}
          </ul>;
        })()}
      </PmBlock>

      {!clientView && (
        <section className="rounded-xl p-4 mb-2" style={{ border: '1px dashed var(--border)' }}>
          <PmEyebrow>Coach only</PmEyebrow>
          <div className="text-sm text-dim space-y-1">
            <p>{PM_LENS[f.lens]} · {PM_TYPES[f.type]} · {f.domains.map(d => PM_DOMAINS[d]).join(', ')}</p>
            {f.client_question && <p>Shown as a question while Thin: <em>{f.client_question}</em></p>}
            <p>{[f.client_undervalues && 'Client undervalues it', f.works_against_aims && 'Works against own aims', f.coach_framed && 'Frame came from the coach'].filter(Boolean).join(' · ') || 'No flags'}</p>
            {(f.client_responses || []).length > 0 && (
              <div className="pt-2">
                <p className="text-[var(--text)]">The client's responses</p>
                {f.client_responses.map((r, i) => <p key={i}>{pmDate(r.at)} · {PM_RESPONSE_WORDS[r.kind]?.replace('You', 'Client') || r.kind}{r.text ? `: "${r.text}"` : ''}</p>)}
              </div>
            )}
          </div>
        </section>
      )}
    </>
  );
}

// The reader: overlay panel with breadcrumb, close, and previous / next (also ← → and Esc).
function PmReader({ crumbs, onClose, prev, next, footer, children, accent }) {
  const body = useRef(null);
  useEffect(() => {
    const k = (e) => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
      if (e.key === 'Escape') onClose();
      if (e.key === 'ArrowRight' && next) next.go();
      if (e.key === 'ArrowLeft' && prev) prev.go();
    };
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  }, [onClose, prev, next]);
  useEffect(() => { if (body.current) body.current.scrollTop = 0; }, [crumbs.join('/')]);
  useEffect(() => { const o = document.body.style.overflow; document.body.style.overflow = 'hidden'; return () => { document.body.style.overflow = o; }; }, []);
  return (
    <div className="fixed inset-0 z-50 flex items-stretch md:items-center justify-center md:p-8" style={{ background: 'rgba(8,6,14,0.72)', backdropFilter: 'blur(3px)' }} onClick={onClose}>
      <div className="w-full max-w-3xl flex flex-col md:rounded-2xl overflow-hidden" style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderTop: `3px solid ${accent || 'var(--primary)'}`, maxHeight: '100%' }} onClick={e => e.stopPropagation()}>
        <div className="flex items-center gap-3 px-5 md:px-7 py-3.5" style={{ borderBottom: '1px solid var(--border)' }}>
          <p className="text-xs text-faint flex-1 min-w-0 truncate">
            {crumbs.map((c, i) => <span key={i}>{i > 0 && <span className="mx-1.5">›</span>}<span className={i === crumbs.length - 1 ? 'text-[var(--text)]' : ''}>{c}</span></span>)}
          </p>
          <button onClick={onClose} className="surface-2 rounded-lg px-3 py-1 text-xs">Close</button>
        </div>
        <div ref={body} className="flex-1 overflow-y-auto px-5 md:px-12 py-8">{children}</div>
        {footer && <div className="px-5 md:px-7 py-3" style={{ borderTop: '1px solid var(--border)', background: 'var(--surface-2)' }}>{footer}</div>}
        <div className="flex items-center gap-3 px-5 md:px-7 py-3" style={{ borderTop: '1px solid var(--border)' }}>
          {prev ? <button onClick={prev.go} className="surface-2 rounded-lg px-3 py-1.5 text-xs text-dim truncate max-w-[45%]">← {prev.label}</button> : <span />}
          <span className="flex-1" />
          {next && <button onClick={next.go} className="surface-2 rounded-lg px-3 py-1.5 text-xs text-dim truncate max-w-[45%]">{next.label} →</button>}
        </div>
      </div>
    </div>
  );
}
